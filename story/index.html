<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Story Quest">
<title>Story Quest</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/ui.css">
<style>
  /* Story Quest only. The frame, buttons, heart pips, and reward panel come
     from the shared stylesheets above. There is no combat here, so this game
     does not load shared/battle.css. */

  /* Quest cards carry a big scene emoji, so they run larger than the compact
     track cards the other two games use. */
  button.choice { padding: 13px 18px; min-width: 190px; }
  button.choice .emoji { font-size: 34px; }
  #game {
    justify-content: flex-start;
    padding: 12px 16px 16px;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #game::-webkit-scrollbar { display: none; }

  .quest-stats {
    font-family: var(--display);
    font-size: 17px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,.5);
    display: flex;
    gap: 16px;
  }
  .quest-stats .gems { color: var(--accent); }

  #art {
    font-size: clamp(48px, 9vw, 84px);
    line-height: 1.2;
    margin: 6px 0 10px;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,.45));
    flex-shrink: 0;
    animation: artIn .45s ease;
  }
  @keyframes artIn { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }

  #storyPanel {
    width: 100%;
    max-width: 700px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 22px;
    padding: 18px 22px 20px;
    box-shadow: 0 -2px 0 rgba(255,255,255,.06) inset, 0 10px 30px rgba(0,0,0,.4);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
    animation: fadeIn .35s ease;
  }

  .story-text {
    font-size: clamp(18px, 2.6vw, 22px);
    line-height: 1.65;
    text-align: left;
    color: rgba(255,255,255,.95);
  }
  .story-text.oops-text { color: #ffc9d4; }
  .story-text.chest-q { text-align: center; font-weight: bold; }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-card {
    font-family: var(--body);
    font-size: clamp(17px, 2.4vw, 20px);
    font-weight: bold;
    text-align: left;
    color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,.4), 0 6px 12px rgba(0,0,0,.25);
    padding: 13px 18px;
  }
  .choice-card::before { content: "▸ "; color: var(--accent); }
  .choice-card:hover { filter: brightness(1.18); }
  .choice-card:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .choice-card.right {
    background: linear-gradient(180deg, #8df3bd, var(--good));
    color: var(--ink);
    border-color: transparent;
  }
  .choice-card.right::before { content: "✓ "; color: var(--ink); }
  .choice-card.wrongPick { animation: wobble .5s; }
  .choice-card.tried {
    opacity: .35;
    pointer-events: none;
    text-decoration: line-through;
  }
  .choice-card.tried::before { content: "✗ "; color: var(--bad); }
  @keyframes wobble { 25% { transform: rotate(-1.5deg); } 75% { transform: rotate(1.5deg); } }

  .oops-box {
    border: 2px dashed rgba(255,94,126,.55);
    border-radius: 14px;
    padding: 12px 16px;
    background: rgba(255,94,126,.12);
  }
  .chest-banner {
    font-family: var(--display);
    font-size: 18px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .chest-reward {
    text-align: center;
    font-family: var(--display);
    font-size: 22px;
    font-weight: bold;
    color: var(--good);
    min-height: 1.4em;
  }

</style>
</head>
<body>
<div id="app">

  <button id="muteBtn" class="sound-toggle" title="Sound on/off" aria-label="Sound on/off">🔊</button>

  <!-- ================= MENU ================= -->
  <section class="screen show scrolls" id="menu">
    <div class="screen-inner">
    <h1>Story Quest</h1>
    <div class="subtitle">Read carefully — the story tells you what to do!</div>

    <div class="group-label">Choose your quest</div>
    <div class="btn-row" id="questRow"></div>

    <div style="margin-top:22px">
      <button id="startBtn" disabled>Begin the Quest!</button>
    </div>
    </div>
  </section>

  <!-- ================= STORY ================= -->
  <section class="screen" id="game">
    <div class="topbar">
      <div class="pips" id="heartPips"></div>
      <div class="quest-stats">
        <span class="gems" id="gemStat">💎 0</span>
        <span id="sceneStat">📖 1 / 12</span>
      </div>
    </div>

    <div id="art">🏰📜</div>
    <div id="storyPanel"></div>
  </section>

  <!-- ================= WIN ================= -->
  <section class="screen" id="win">
    <div class="end-emoji">🏆</div>
    <h1>Quest Complete!</h1>
    <div class="subtitle" id="winText">You finished the quest!</div>

    <!-- What this quest paid. iPad time is bought in the hub shop now. -->
    <div id="earned" class="reward"></div>

    <button id="winAgainBtn" class="ghost-btn">Back to quests</button>
  </section>

  <!-- ================= LOSE ================= -->
  <section class="screen" id="lose">
    <div class="end-emoji">💫</div>
    <h1>Out of hearts!</h1>
    <div class="subtitle">Every hero re-reads. The clues are always in the story —
      look for them and try again!</div>
    <div class="btn-row">
      <button id="retryBtn">Try the quest again!</button>
      <button id="loseMenuBtn" class="ghost-btn">Back to quests</button>
    </div>
  </section>

</div>

<script src="../shared/sound.js"></script>
<script src="../shared/save.js"></script>
<script src="../shared/hud.js"></script>
<script>
'use strict';

/* ==================================================================
   Quests — the stories ARE the game. Authoring rules (see CLAUDE.md):
   each scene has exactly one `ok` choice, and the story text must
   contain the clue that makes it the right one. Wrong choices carry a
   short, funny `oops` consequence. Optional treasure `chest` questions
   (recall / vocabulary / inference / sequencing) reward a gem and heal
   one heart.
   ================================================================== */
const QUESTS = [

const MAX_HEARTS = 5;

/* ==================================================================
   Helpers
   ================================================================== */
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
// all UI pacing goes through here; tests set window.TEST_FAST to run
// the continuation synchronously so a script can click through a quest
const later = (fn, ms) => window.TEST_FAST ? fn() : setTimeout(fn, ms);

/* ==================================================================
   State
   ================================================================== */
const state = {
  questIdx: null,
  sceneIdx: 0,
  hearts: MAX_HEARTS,
  gems: 0,
  order: [],        // this scene's shuffled choice order
  tried: new Set(), // wrong choices already tried this scene
  busy: false,
  goldAtStart: 0,     // so the win screen can show what this quest paid
};

// The hero chip, and the gate: no hero picked means back to the hub.
Hud.mount({ home: '../index.html' });

const quest = () => QUESTS[state.questIdx];
const scene = () => quest().scenes[state.sceneIdx];

/* ==================================================================
   Screens
   ================================================================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  $(id).classList.add('show');
}

/* ==================================================================
   Menu
   ================================================================== */
const questsDone = (Save.me() && Save.me().progress.questsDone) || [];
QUESTS.forEach((q, i) => {
  const b = document.createElement('button');
  b.className = 'choice';
  // a finished quest keeps a tick, so it's obvious which are left to play
  const done = questsDone.indexOf(i) !== -1 ? ' \u2705' : '';
  b.innerHTML = `<span class="emoji">${q.emoji}</span>${q.title}${done}` +
    `<span class="sub">${q.sub} \u00b7 ${q.scenes.length} scenes</span>`;
  b.addEventListener('click', () => {
    Sound.unlock(); Sound.click();
    document.querySelectorAll('#questRow .choice').forEach(c => c.classList.remove('sel'));
    b.classList.add('sel');
    state.questIdx = i;
    $('startBtn').disabled = false;
  });
  $('questRow').appendChild(b);
});

$('startBtn').addEventListener('click', () => {
  Sound.unlock(); Sound.click();
  startQuest();
});

function renderMute() {
  $('muteBtn').textContent = Sound.muted ? '🔇' : '🔊';
  $('muteBtn').classList.toggle('muted', Sound.muted);
}
$('muteBtn').addEventListener('click', () => {
  Sound.muted = !Sound.muted;   // shared/sound.js persists the preference
  renderMute();
});
renderMute();

/* ==================================================================
   Quest flow
   ================================================================== */
function startQuest() {
  state.sceneIdx = 0;
  state.goldAtStart = (Save.me() || { gold: 0 }).gold;
  state.hearts = MAX_HEARTS;
  state.gems = 0;
  state.busy = false;
  showScreen('game');
  renderScene(true);
}

function renderStats() {
  const pips = $('heartPips');
  pips.innerHTML = '';
  for (let i = 0; i < MAX_HEARTS; i++) {
    const p = document.createElement('span');
    p.className = 'pip heart' + (i < state.hearts ? '' : ' empty');
    pips.appendChild(p);
  }
  $('gemStat').textContent = '💎 ' + state.gems;
  $('sceneStat').textContent = `📖 ${state.sceneIdx + 1} / ${quest().scenes.length}`;
}

function renderScene(fresh) {
  const sc = scene();
  if (fresh) {
    state.order = shuffle(sc.choices);
    state.tried = new Set();
  }
  state.busy = false;
  renderStats();
  $('art').textContent = sc.art;
  // restart the art pop-in
  $('art').style.animation = 'none';
  void $('art').offsetWidth;
  $('art').style.animation = '';

  const panel = $('storyPanel');
  panel.innerHTML = '';

  const txt = document.createElement('div');
  txt.className = 'story-text';
  txt.textContent = sc.text;
  panel.appendChild(txt);

  const box = document.createElement('div');
  box.className = 'choices';
  state.order.forEach(choice => {
    const c = document.createElement('button');
    c.className = 'choice-card' + (state.tried.has(choice) ? ' tried' : '');
    c.textContent = choice.t;
    c.addEventListener('click', () => pickChoice(c, choice));
    box.appendChild(c);
  });
  panel.appendChild(box);
}

function pickChoice(el, choice) {
  if (state.busy) return;
  state.busy = true;

  if (choice.ok) {
    Sound.right();
    el.classList.add('right');
    Save.recordAnswer(true);
    Hud.applied(Save.awardEvent('storyChoice'));
    later(() => {
      const sc = scene();
      if (sc.chest) renderChest(sc.chest);
      else nextScene();
    }, 700);
  } else {
    Sound.wrong();
    el.classList.add('wrongPick');
    Save.recordAnswer(false);   // a lost heart is punishment enough
    state.tried.add(choice);
    state.hearts--;
    renderStats();
    later(() => {
      if (state.hearts <= 0) return questFailed();
      renderOops(choice.oops);
    }, 500);
  }
}

// a wrong choice: show the consequence, then let them re-read and retry
function renderOops(text) {
  const panel = $('storyPanel');
  panel.innerHTML = '';

  const box = document.createElement('div');
  box.className = 'oops-box';
  const txt = document.createElement('div');
  txt.className = 'story-text oops-text';
  txt.textContent = text;
  box.appendChild(txt);
  panel.appendChild(box);

  const back = document.createElement('button');
  back.className = 'choice-card';
  back.textContent = '📖 Read the story again';
  back.addEventListener('click', () => { Sound.page(); renderScene(false); });
  panel.appendChild(back);
  state.busy = false;
}

/* ==================================================================
   Treasure chests — bonus comprehension questions. A right answer
   earns a gem and heals one heart; a wrong one just locks the chest
   (never punished — the chests are pure reward).
   ================================================================== */
function renderChest(chest) {
  state.busy = false;
  $('art').textContent = '🧰✨';

  const panel = $('storyPanel');
  panel.innerHTML = '';

  const banner = document.createElement('div');
  banner.className = 'chest-banner';
  banner.textContent = '✨ A treasure chest! Answer to open it ✨';
  panel.appendChild(banner);

  const q = document.createElement('div');
  q.className = 'story-text chest-q';
  q.textContent = chest.q;
  panel.appendChild(q);

  const box = document.createElement('div');
  box.className = 'choices';
  const rewardLine = document.createElement('div');
  rewardLine.className = 'chest-reward';

  shuffle(chest.a).forEach(ans => {
    const c = document.createElement('button');
    c.className = 'choice-card';
    c.textContent = ans;
    c.addEventListener('click', () => {
      if (state.busy) return;
      state.busy = true;
      [...box.children].forEach(b => { b.style.pointerEvents = 'none'; });
      if (ans === chest.right) {
        Sound.chest();
        c.classList.add('right');
        Hud.applied(Save.awardEvent('storyChest'));
        state.gems++;
        const healed = state.hearts < MAX_HEARTS;
        if (healed) state.hearts++;
        renderStats();
        rewardLine.textContent = healed ? '+1 💎  +1 ❤️' : '+1 💎';
      } else {
        Sound.wrong();
        c.classList.add('wrongPick', 'tried');
        [...box.children].find(b => b.textContent === chest.right).classList.add('right');
        rewardLine.textContent = 'The chest stays locked... next time!';
      }
      later(nextScene, 1400);
    });
    box.appendChild(c);
  });
  panel.appendChild(box);
  panel.appendChild(rewardLine);
}

function nextScene() {
  state.sceneIdx++;
  if (state.sceneIdx >= quest().scenes.length) return questComplete();
  Sound.page();
  renderScene(true);
}

/* ==================================================================
   Win / lose + the iPad-time reward timer
   ================================================================== */
function questComplete() {
  Save.recordQuestDone(state.questIdx);
  Save.recordRunWon('story');
  const bonus = Save.awardEvent('questDone');
  // each quest has its own character card, in QUESTS order
  const card = Save.STORY_CARDS[state.questIdx];
  const drop = card && Save.awardCard(card.id);
  Sound.victory();
  const total = quest().scenes.filter(s => s.chest).length;
  $('winText').textContent =
    `You finished ${quest().title} with ${state.gems} of ${total} gems!`;
  showEarnings();
  showScreen('win');
  Hud.applied(bonus);
  if (drop) later(() => Hud.cardDrop(card, drop), 1400);
}

// What this quest put in the purse. Gold is the reward now — iPad time is
// bought with it back at the hub.
function showEarnings() {
  const now = (Save.me() || { gold: 0 }).gold;
  const won = Math.max(0, now - state.goldAtStart);
  $('earned').innerHTML =
    '<div class="reward-line">\u{1FA99} You earned <b></b> gold on this quest!</div>' +
    '<div class="reward-hint">Spend it in the shop \u2014 swords, armor, pets, ' +
    'new worlds, and iPad game time.</div>';
  $('earned').querySelector('b').textContent = won;
}

function questFailed() {
  Sound.gameover();
  showScreen('lose');
}

$('winAgainBtn').addEventListener('click', () => { Sound.click(); showScreen('menu'); });
// Test seam: .verify/ scripts drive the real game and need to know which
// choice is the right one. Costs nothing in play.
window.TEST = { state, scene, quest, QUESTS, startQuest, showEarnings };

$('retryBtn').addEventListener('click', () => { Sound.click(); startQuest(); });
$('loseMenuBtn').addEventListener('click', () => { Sound.click(); showScreen('menu'); });
</script>
