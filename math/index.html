    el.endEmoji.textContent = "💀";
    el.endTitle.textContent = "Game Over";
    el.endText.textContent = "The monster got you! You still keep your gold.";
    Sound.lose();
    Log.endSession({ won: false, gold: earnedThisRun() });
    showScreen("endScreen");
    Hud.flush();          // whatever was earned still gets opened
  }

  // What this run put in the purse. Gold is the reward now — iPad time is
  // bought with it back at the hub.
  function earnedThisRun() {
    return Math.max(0, (Save.me() || { gold: 0 }).gold - state.goldAtStart);
  }

  function showEarnings() {
    const won = earnedThisRun();
    el.earned.innerHTML =
      '<div class="reward-line">\ud83e\ude99 You earned <b></b> gold this battle!</div>' +
      '<div class="reward-hint">Spend it in the shop \u2014 swords, armor, pets, ' +
      'new worlds, and iPad game time.</div>';
    el.earned.querySelector("b").textContent = won;
  }

  // ---------- Answer entry (on-screen pad + physical keyboard) ----------
  // The answer box is readonly so iOS never raises its keyboard; every digit
  // comes through here instead. The cap is MAX_ANSWER_DIGITS.
  function pressKey(k) {
    if (state.busy) return;
    if (k === "back") {
      el.answer.value = el.answer.value.slice(0, -1);
    } else {
      if (el.answer.value.length >= MAX_ANSWER_DIGITS) return;
      el.answer.value += k;
    }
    el.answer.classList.remove("wrong");
    Sound.click();
  }

  // ---------- Events ----------
  el.startBtn.addEventListener("click", () => {
    // starting from the menu is free play, even if a map stop brought us here
    state.node = null;
    Save.clearNode();
    startGame();
  });
  el.playAgainBtn.addEventListener("click", () => {
    Sound.click();
    if (state.mapReturn) return Hud.backToMap(state.mapReturn);
    // back to the menu is free play again
    state.node = null;
    Save.clearNode();
    showScreen("menu");
  });
  el.attackBtn.addEventListener("click", playerAttack);
  el.keypad.addEventListener("click", (e) => {
    const b = e.target.closest("button.key");
    if (b) pressKey(b.dataset.key);
  });
  el.backBtn.addEventListener("click", () => pressKey("back"));
  // Physical keyboards (laptops) keep working during a battle.
  document.addEventListener("keydown", (e) => {
    if (!el.battle.classList.contains("show") || state.choices) return;
    if (e.key === "Enter") { e.preventDefault(); playerAttack(); }
    else if (e.key === "Backspace") { e.preventDefault(); pressKey("back"); }
    else if (/^\d$/.test(e.key)) { e.preventDefault(); pressKey(e.key); }
  });
  el.muteBtn.addEventListener("click", () => { Sound.toggle(); renderMute(); });
  el.pushBtn.addEventListener("click", () => {
    if (state.track === "sub") takeAway(); else mergeTowers();
  });
  attachDrag(el.towerA);
  attachDrag(el.towerB);

  // Arrived from a map stop? Play exactly that, and skip the menu.
  (function fromMap() {
    // ...or straight from the hub's Rematch button
    if (/[?&]rematch=1/.test(location.search) && Log.dueCount("math")) {
      state.track = "rematch";
      startGame();
      return;
    }
    // ...or today's challenge, which is free play of a stop's content at
    // double gold rather than the stop itself
    if (/[?&]daily=1/.test(location.search)) {
      const d = Save.daily();
      if (d && d.node.g === "math") {
        state.track = d.node.t;
        state.mode = d.node.m;
        state.daily = true;
        startGame();
        return;
      }
    }
    const node = Save.activeNode();
    if (!node || node.g !== "math") return showScreen("menu");
    state.track = node.t;
    state.mode = node.m;
    state.node = node;
    startGame();
  })();

  // Test seam: .verify/ scripts drive the real game and need to read the
  // answer and the run state. Costs nothing in play.
  window.TEST = { state, FOES, MODES, TRACK_TIME, timing, MAX_ANSWER_DIGITS, newProblem, playerAttack, showEarnings,
                 makers: MAKERS, TRACKS, sortGroups: SORT_GROUPS, bumpRuleTier };
})();
</script>
</body>
</html>
