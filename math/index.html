<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Math RPG">
<title>Math RPG</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="../shared/battle.css">
<style>
  /* Math RPG only. The frame, buttons, pips, arena, and timer bar come from
     the shared stylesheets above. */
  /* A quieter heading than .group-label, for the groups inside a hero row. */
  .rematch-head { color: #ffc9d4; }
  #menu button.choice.rematch-card {
    border-color: rgba(255,94,126,.6);
    background: linear-gradient(180deg, rgba(255,94,126,.24), rgba(255,94,126,.10));
    min-width: 190px;
  }

  .sub-label {
    font-family: var(--body);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
    margin: 12px 0 6px;
  }
  /* nineteen cards need to be smaller than seven did */
  #menu button.choice { font-size: 16px; padding: 10px 12px; min-width: 132px; }
  #menu button.choice .emoji { font-size: 26px; margin-bottom: 2px; }
  #menu button.choice .sub { font-size: 11px; }

  /* ---------- Battle screen ---------- */
  #battle { justify-content: flex-start; padding: 12px 16px; }
  #battle.with-blocks .arena::before, #battle.with-blocks .arena::after { display: none; }

  .question {
    font-family: var(--display);
    font-size: clamp(38px, 7vw, 56px);
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 6px;
    align-self: center;
    padding: 4px 22px;
    border-radius: 16px;
    background: rgba(0,0,0,.22);
    border: 1px solid rgba(255,255,255,.08);
    text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }

  /* ---------- Number blocks (addition only) ---------- */
  .blocks-area {
    display: flex;
    flex-direction: column;   /* towers row on top, push button on its own line */
    align-items: center;
    gap: 6px;
    margin: 2px 0;
    position: relative;
  }
  .blocks-area.hidden { display: none; }

  .blocks-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;      /* keeps the + centered against the towers */
    justify-content: center;
    gap: 14px;
  }

  .tower {
    display: grid;
    grid-auto-flow: column;   /* fill top-to-bottom, then start a new column */
    grid-template-rows: repeat(3, 38px);   /* ~3 big blocks per column, then wrap */
    grid-auto-columns: 38px;
    gap: 5px;
    padding: 6px;
    border-radius: 12px;
    background: rgba(0, 0, 0, 0.18);
    cursor: grab;
    touch-action: none;
    transition: transform 0.25s ease, opacity 0.25s ease;
  }
  .tower.dragging { cursor: grabbing; transition: none; z-index: 3; }
  .tower.merged-pop { animation: blockPop 0.45s ease; }

  .block {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.25), 0 2px 3px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  .block.count, .block.pulse { animation: blockPop 0.3s ease; }
  @keyframes blockPop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }

  /* subtraction: blocks marked to be taken away, then their removal */
  .block.remove-mark { opacity: .35; border-style: dashed; border-color: rgba(255,255,255,.75); }
  .block.removing { animation: blockRemove 0.45s ease forwards; }
  @keyframes blockRemove {
    0% { transform: scale(1); opacity: .6; }
    35% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(0) translateY(-26px); opacity: 0; }
  }

  /* Make 10: the gap drawn as empty slots, so the child counts the space */
  .tower.gap { background: transparent; }
  .block.hole {
    background: transparent;
    border: 3px dashed rgba(255,255,255,.55);
    box-shadow: none;
  }

  /* ---------- Coins ---------- */
  .coin-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 4px 0; }
  .coin-row.hidden, .clock-box.hidden, .blocks-row.hidden, .push-btn.hidden { display: none; }
  .coin {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    padding: 0;
    font-family: var(--display);
    font-size: 20px;
    color: #4a3410;
    border: 3px solid rgba(255,255,255,.45);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.22), 0 3px 4px rgba(0,0,0,.4);
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 1px;
  }
  .coin small { font-size: 12px; }
  /* each denomination its own metal, so they're told apart by sight */
  .coin.c1  { background: linear-gradient(180deg, #e8a87c, #c8763f); }
  .coin.c5  { background: linear-gradient(180deg, #d8dde3, #9aa4b0); width: 60px; height: 60px; }
  .coin.c10 { background: linear-gradient(180deg, #e6ebf0, #aab4c0); width: 48px; height: 48px; }
  .coin.c25 { background: linear-gradient(180deg, #dfe5ec, #98a3b1); width: 66px; height: 66px; font-size: 22px; }
  .coin.pop { animation: blockPop 0.3s ease; }

  /* ---------- Clock ---------- */
  .clock-box { display: flex; justify-content: center; margin: 2px 0; }

  /* ---------- Fraction bars ---------- */
  .bar-box { display: flex; flex-direction: column; gap: 8px; align-items: center; margin: 2px 0; }
  .bar-box.hidden { display: none; }
  .bar-row { display: flex; align-items: center; gap: 12px; }
  .bar-label {
    font-family: var(--display);
    font-size: 20px;
    line-height: 1;
    text-align: center;
    min-width: 34px;
  }
  /* a real fraction bar, not a slash */
  .bar-label b { display: block; font-weight: bold; }
  .bar-label i {
    display: block;
    height: 2px;
    background: #fff;
    margin: 2px auto;
    width: 20px;
  }
  /* Every bar is the same total width, whatever it's cut into. This is the
     whole point: a half and three-eighths can only be compared if the wholes
     match. Sizing each bar to its segment count drew 3/8 wider than 1/2,
     which says the opposite of the truth. */
  .frac-bar {
    display: flex;
    gap: 3px;
    width: 300px;
    background: rgba(0,0,0,.25);
    padding: 4px;
    border-radius: 10px;
  }
  .frac-bar .seg {
    flex: 1;
    height: 34px;
    border-radius: 6px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.18);
    cursor: pointer;
  }
  .frac-bar .seg.on {
    background: linear-gradient(180deg, #ffe27a, var(--accent));
    border-color: transparent;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.2);
  }
  .frac-bar .seg.pop { animation: blockPop 0.3s ease; }

  .blocks-plus { font-size: 34px; font-weight: bold; color: var(--accent); align-self: center; }
  .push-btn { align-self: center; font-size: 18px; padding: 10px 16px; }
  .push-btn:disabled { filter: grayscale(0.6) brightness(0.9); cursor: default; box-shadow: 0 5px 0 #777; }

  /* give blocks room: shrink the fight scene in addition mode so nothing collides */
  #battle.with-blocks { overflow-y: auto; scrollbar-width: none; }
  #battle.with-blocks::-webkit-scrollbar { display: none; }
  #battle.with-blocks .topbar { margin-bottom: 4px; }
  #battle.with-blocks .arena { flex: 0 0 auto; min-height: 0; height: 80px; }
  #battle.with-blocks .sprite { font-size: clamp(44px, 8vw, 76px); }
  #battle.with-blocks .sprite.foe { font-size: calc(clamp(44px, 8vw, 76px) * var(--foe-scale, 1)); }
  #battle.with-blocks .question { font-size: clamp(28px, 5vw, 40px); margin-bottom: 4px; padding: 2px 16px; }
  #battle.with-blocks .problem-panel { padding: 14px 18px 16px; gap: 7px; }
  #battle.with-blocks .hint { display: none; }

  /* ---------- Tap-to-answer tiles ---------- */
  .tiles {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 4px 0 2px;
  }
  .tiles.hidden, .answer-row.hidden, .keypad.hidden { display: none; }
  .tile {
    font-family: var(--display);
    font-size: 34px;
    min-width: 92px;
    padding: 12px 20px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,.12);
    color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
    box-shadow: 0 5px 0 rgba(0,0,0,.4), 0 8px 16px rgba(0,0,0,.25);
  }
  .tile:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .tile.right {
    background: linear-gradient(180deg, #8affc4, var(--good));
    color: var(--ink);
    box-shadow: 0 5px 0 #2fa872, 0 0 0 3px rgba(92,232,160,.35);
  }
  .tile.wrongPick {
    background: linear-gradient(180deg, #ff96ab, var(--bad));
    color: #fff;
    box-shadow: 0 5px 0 #c23a55;
  }
  /* the rule-naming tiles carry words, not a single glyph */
  .tile.word { font-size: 22px; }

  /* Sort It! and Rule Hunter ask a whole question, so the box has to fit a
     sentence rather than "7 × 8". */
  .question.wordy { font-size: clamp(20px, 3.4vw, 30px); letter-spacing: 0; }

  .answer-row { display: flex; gap: 12px; justify-content: center; align-items: center; }
  #answer {
    font-family: var(--display);
    font-size: 40px;
    font-weight: bold;
    width: 160px;
    text-align: center;
    padding: 10px;
    border-radius: 14px;
    border: 3px solid rgba(255,255,255,.12);
    background: rgba(0,0,0,.28);
    color: #fff;
    outline: none;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.4);
    transition: border-color .15s, background .15s;
  }
  #answer:focus { border-color: var(--accent); }
  #answer.correct { border-color: var(--good); background: rgba(74,222,128,.2); }
  #answer.wrong { border-color: var(--bad); background: rgba(248,113,113,.2); animation: shake .3s; }

  #answer { caret-color: var(--accent); cursor: default; }

  /* ---------- On-screen number pad ---------- */
  .key-back-btn {
    background: rgba(255,255,255,.12);
    color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,.35);
    font-size: 26px;
    padding: 14px 18px;
  }
  .key-back-btn:active { box-shadow: 0 1px 0 rgba(0,0,0,.35); }

  .keypad {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-top: 8px;
    touch-action: manipulation;
  }
  .key {
    font-family: var(--display);
    font-size: 30px;
    font-weight: bold;
    padding: 13px 0;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.10);
    color: #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
    box-shadow: 0 4px 0 rgba(0,0,0,.4), 0 6px 12px rgba(0,0,0,.25);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    transition: transform .06s, box-shadow .06s, filter .12s;
  }
  .key:hover { filter: brightness(1.18); }
  .key:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.4); }

  /* addition mode has the blocks above, so trim the pad only slightly */
  #battle.with-blocks .keypad { gap: 9px; margin-top: 6px; }
  #battle.with-blocks .key { font-size: 28px; padding: 12px 0; }
</style>
</head>
<body>
<div id="app">

  <button id="muteBtn" class="sound-toggle" title="Sound on/off" aria-label="Sound on/off">🔊</button>

  <!-- MENU -->
  <section id="menu" class="screen show scrolls">
    <div class="screen-inner">
    <h1>Math RPG</h1>
    <div class="subtitle">Defeat the monster with your math powers!</div>

    <!-- Both rows are rendered from the TRACKS registry in the script below,
         grouped so nineteen cards stay findable. -->
    <div class="group-label">Little hero powers</div>
    <div id="trackRow"></div>

    <div class="group-label">Big hero powers</div>
    <div id="trackRow2"></div>

    <div class="group-label">Choose your difficulty</div>
    <div class="btn-row" id="modeRow">
      <button class="choice" data-mode="easy">
        <span class="emoji">🐢</span>Easy
        <span class="sub">Relaxed timer</span>
      </button>
      <button class="choice" data-mode="normal">
        <span class="emoji">🐇</span>Normal
        <span class="sub">Some time pressure</span>
      </button>
      <button class="choice" data-mode="expert">
        <span class="emoji">⚡</span>Expert
        <span class="sub">Beat the clock!</span>
      </button>
    </div>

    <div style="margin-top:22px">
      <button id="startBtn">Start Battle!</button>
    </div>
    </div>
  </section>

  <!-- BATTLE -->
  <section id="battle" class="screen">
    <div class="nodebar hidden" id="nodeBar"></div>

    <div class="topbar">
      <div class="fighter-info player">
        <div class="name">🦸 You</div>
        <div class="pips player" id="playerHp"></div>
      </div>
      <div class="fighter-info foe">
        <div class="name" id="foeName">👾 Monster</div>
        <div class="pips foe" id="foeHp"></div>
      </div>
    </div>

    <div class="arena" id="arena">
      <div class="sprite player" id="playerSprite">🦸</div>
      <div class="party" id="allies">
        <div class="pet" id="pet" style="display:none"></div>
      </div>
      <div class="slash" id="slash">💥</div>
      <div class="sprite foe" id="foeSprite">👾</div>
    </div>

    <div class="problem-panel">
      <div class="timer-row">
        <div class="timer-track" id="timerTrack">
          <div class="bar" id="timerBar"></div>
          <div class="fast-marker" id="fastMarker"></div>
        </div>
        <div class="super-label" id="superLabel">⚡ DOUBLE! ⚡</div>
      </div>
      <div class="question" id="question">2 + 3</div>

      <div class="blocks-area hidden" id="blocksArea">
        <div class="coin-row hidden" id="coinRow"></div>
        <div class="clock-box hidden" id="clockBox"></div>
        <div class="bar-box hidden" id="barBox"></div>
        <div class="blocks-row" id="blocksRow">
          <div class="tower" id="towerA"></div>
          <div class="blocks-plus" id="plusSign">+</div>
          <div class="tower" id="towerB"></div>
        </div>
        <button class="push-btn" id="pushBtn">👐 Push together</button>
      </div>

      <!-- Tap-to-answer tracks (patterns, sorting, naming a rule) use these
           tiles instead of the number pad; only one is on screen at a time. -->
      <div class="tiles hidden" id="tiles"></div>

      <div class="answer-row" id="answerRow">
        <input id="answer" type="text" inputmode="none" readonly autocomplete="off" />
        <button id="backBtn" class="key-back-btn" aria-label="Delete">⌫</button>
        <button id="attackBtn">⚔️ Attack!</button>
      </div>

      <!-- On-screen number pad (so the iPad keyboard never has to appear). -->
      <div class="keypad" id="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key" data-key="0">0</button>
      </div>

      <div class="hint">⚡ Answer before the white line for a DOUBLE hit!</div>
    </div>

    <div id="flashOverlay"></div>
  </section>

  <!-- GAME OVER / WIN -->
  <section id="endScreen" class="screen">
    <div class="end-emoji" id="endEmoji">🏆</div>
    <h1 id="endTitle">Victory!</h1>
    <div class="subtitle" id="endText">You defeated the monster!</div>

    <!-- What this run paid. iPad time is bought in the hub shop now. -->
    <div id="earned" class="reward"></div>

    <button id="playAgainBtn">Play Again</button>
  </section>

</div>

<script src="../shared/sound.js"></script>
<script src="../shared/save.js"></script>
<script src="../shared/log.js"></script>
<script src="../shared/hud.js"></script>
  <script src="../shared/allies.js"></script>
<script>
(() => {
  "use strict";


  // ---------- Config ----------
  // total = full time bar; fast = answer within this for a SUPER double hit;
  // penalty = does running out of time let the foe counterattack?
  /* Per-question timing. NOTE: milliseconds here; Language RPG's MODES are in
     seconds. Watch that when copying values between the two.

     `total` is the whole bar, `fast` the gold double-hit window at the start,
     `penalty` whether running out lets the foe hit back.

     These are generous on purpose. The timer exists to reward quick recall,
     not to rush a child who is working something out — and on the blocks
     tracks he is physically counting, which takes as long as it takes. Easy
     never punishes a timeout at all. */
  const MODES = {
    easy:   { total: 50000, fast: 15000, penalty: false, label: "Easy" },
    normal: { total: 35000, fast: 11000, penalty: true,  label: "Normal" },
    expert: { total: 20000, fast: 6000,  penalty: true,  label: "Expert" },
  };

  // scale evens out how much of the em-box each emoji actually fills, so a
  // solid circle and a sprawling dragon read as similar-sized foes (with the
  // boss nudged a touch larger). Tuned by screenshot.
  // the tracks that show the number-blocks counting aid
  const BLOCK_TRACKS = ["add", "count", "sub", "bonds", "coins", "clock", "fract"];

  const PLAYER_DAMAGE = 1;
  const FOE_DAMAGE = 1;

  // The monsters, the hearts, the timer, and the slash all come from the
  // hero's world and equipped gear (shared/save.js). Read fresh at the start
  // of each run so a shop trip takes effect immediately.
  let FOES = Save.foesFor("math");
  let GEAR = Save.loadout();

  // Numberblocks-style colors: each whole number has its own color.
  const BLOCK_COLORS = {
    1: "#ff3b30", 2: "#ff9500", 3: "#ffcc00", 4: "#34c759", 5: "#00c7e6",
    6: "#0a84ff", 7: "#5e5ce6", 8: "#bf5af2", 9: "#ff2d95", 10: "#aeb4bd",
  };
  function blockColor(n) {
    return BLOCK_COLORS[n] || `hsl(${(n * 47) % 360} 80% 55%)`;
  }

  // ---------- State ----------
  const state = {
    track: "add",
    mode: "normal",
    playerHp: 5,
    foeIndex: 0,
    foeHp: 0,
    answer: 0,
    choices: null,       // set on tap-to-answer tracks; null means number pad
    a: 0,
    b: 0,
    merged: false,
    taken: false,
    timerId: null,
    timerStart: 0,
    busy: false,
    queue: null,         // The Rematch: the questions owed another go
    rematchOf: null,     // the one currently being re-asked
    node: null,          // the map stop being played, if any
    mapReturn: null,     // set on winning one, so the end screen sends you back
    shield: 0,           // one free hit, if a pet is equipped
    goldAtStart: 0,      // so the win screen can show what this run paid
  };

  // ---------- Element refs ----------
  const $ = (id) => document.getElementById(id);
  const el = {
    menu: $("menu"), battle: $("battle"), end: $("endScreen"),
    trackRow: $("trackRow"), trackRow2: $("trackRow2"),
    modeRow: $("modeRow"), startBtn: $("startBtn"),
    playerHp: $("playerHp"), foeHp: $("foeHp"), foeName: $("foeName"),
    playerSprite: $("playerSprite"), foeSprite: $("foeSprite"), pet: $("pet"),
    slash: $("slash"), arena: $("arena"),
    timerTrack: $("timerTrack"), timerBar: $("timerBar"),
    fastMarker: $("fastMarker"), superLabel: $("superLabel"),
    question: $("question"), answer: $("answer"), attackBtn: $("attackBtn"),
    keypad: $("keypad"), backBtn: $("backBtn"),
    answerRow: $("answerRow"), tiles: $("tiles"), nodeBar: $("nodeBar"),
    flashOverlay: $("flashOverlay"),
    blocksArea: $("blocksArea"), towerA: $("towerA"), towerB: $("towerB"),
    blocksRow: $("blocksRow"), coinRow: $("coinRow"), clockBox: $("clockBox"),
    barBox: $("barBox"),
    plusSign: $("plusSign"), pushBtn: $("pushBtn"),
    endEmoji: $("endEmoji"), endTitle: $("endTitle"), endText: $("endText"),
    playAgainBtn: $("playAgainBtn"), muteBtn: $("muteBtn"),
    earned: $("earned"),
  };
  // The hero chip, and the gate: no hero picked means back to the hub.
  Hud.mount({ home: "../index.html" });

  // reflect saved mute preference on the toggle
  function renderMute() {
    el.muteBtn.textContent = Sound.isMuted() ? "🔇" : "🔊";
    el.muteBtn.classList.toggle("muted", Sound.isMuted());
  }
  renderMute();

  /* ==================================================================
     The tracks — one place that knows everything about each power.

     Nineteen cards in two flat rows is a wall to a six-year-old, so each
     track names the group it belongs to and the menu renders them under
     headings. Adding a track is one entry here and nothing else.
     ================================================================== */
  const TRACKS = [
    // --- little hero ---
    { id: "next",    row: "little", group: "Counting",   emoji: "🔢", name: "Next Number",      sub: "What comes after?" },
    { id: "oneless", row: "little", group: "Counting",   emoji: "↕️", name: "One More, One Less", sub: "Both directions" },
    { id: "skip",    row: "little", group: "Counting",   emoji: "🦘", name: "Skip Counting",    sub: "5, 10, 15…" },
    { id: "count",   row: "little", group: "Adding & taking away", emoji: "👣", name: "Count On", sub: "Add 1, 2 or 3" },
    { id: "add",     row: "little", group: "Adding & taking away", emoji: "➕", name: "Addition", sub: "Push blocks together" },
    { id: "sub",     row: "little", group: "Adding & taking away", emoji: "➖", name: "Subtraction", sub: "Take blocks away" },
    { id: "bonds",   row: "little", group: "Adding & taking away", emoji: "🔟", name: "Make 10", sub: "7 and how many more?" },
    { id: "pattern", row: "little", group: "Thinking",   emoji: "🎨", name: "Pattern Blocks",   sub: "What comes next?" },
    { id: "sort",    row: "little", group: "Thinking",   emoji: "🧺", name: "Sort It!",         sub: "Which doesn't belong?" },
    { id: "coins",   row: "little", group: "Everyday",   emoji: "🪙", name: "Coins",            sub: "How much money?" },
    { id: "clock",   row: "little", group: "Everyday",   emoji: "🕐", name: "Clock",            sub: "What time is it?" },

    // --- big hero ---
    { id: "mul",     row: "big", group: "Times tables",  emoji: "✖️", name: "Multiplication",   sub: "Times tables" },
    { id: "div",     row: "big", group: "Times tables",  emoji: "➗", name: "Division",         sub: "Times tables in reverse" },
    { id: "alg",     row: "big", group: "Thinking",      emoji: "🧩", name: "Algebra",          sub: "Solve for x" },
    { id: "rule",    row: "big", group: "Thinking",      emoji: "🔍", name: "Rule Hunter",      sub: "Find the pattern's rule" },
    { id: "fract",   row: "big", group: "Fractions",     emoji: "🍕", name: "Fractions",        sub: "Halves, thirds, quarters" },
    { id: "wordprob",row: "big", group: "Bigger numbers", emoji: "📖", name: "Word Problems",    sub: "Read it, then solve it" },
    { id: "place",   row: "big", group: "Bigger numbers", emoji: "🔢", name: "Big Numbers",      sub: "Carrying, borrowing, rounding" },
    { id: "applied", row: "big", group: "Everyday",      emoji: "⏱️", name: "Everyday Maths",   sub: "Change, time and measuring" }
  ];

  const track = (id) => TRACKS.filter((t) => t.id === id)[0];

  /* Build both menu rows, grouped. */
  (function buildMenu() {
    ["little", "big"].forEach((row) => {
      const host = row === "little" ? el.trackRow : el.trackRow2;
      const groups = [];
      TRACKS.filter((t) => t.row === row).forEach((t) => {
        let g = groups.filter((x) => x.name === t.group)[0];
        if (!g) { g = { name: t.group, items: [] }; groups.push(g); }
        g.items.push(t);
      });
      groups.forEach((g) => {
        const head = document.createElement("div");
        head.className = "sub-label";
        head.textContent = g.name;
        host.appendChild(head);
        const strip = document.createElement("div");
        strip.className = "btn-row";
        g.items.forEach((t) => {
          const b = document.createElement("button");
          b.className = "choice";
          b.dataset.track = t.id;
          b.innerHTML = `<span class="emoji">${t.emoji}</span>${t.name}` +
                        `<span class="sub">${t.sub}</span>`;
          strip.appendChild(b);
        });
        host.appendChild(strip);
      });
    });
  })();

  /* The Rematch card, pinned above everything when questions are owed. */
  (function buildRematch() {
    const owed = Log.dueCount("math");
    if (!owed) return;
    const head = document.createElement("div");
    head.className = "sub-label rematch-head";
    head.textContent = "They beat you once";
    const strip = document.createElement("div");
    strip.className = "btn-row";
    const b = document.createElement("button");
    b.className = "choice rematch-card";
    b.dataset.track = "rematch";
    b.innerHTML = `<span class="emoji">🎯</span>The Rematch` +
      `<span class="sub">${owed} question${owed === 1 ? "" : "s"} want another go</span>`;
    strip.appendChild(b);
    el.trackRow.parentNode.insertBefore(strip, el.trackRow);
    el.trackRow.parentNode.insertBefore(head, strip);
  })();

  // ---------- Menu selection ----------
  /* One delegated handler per kind of choice. The whole menu is the
     container now, because the Rematch card is pinned outside both track
     rows — so a click has to be ignored unless the card carries this kind
     of choice, or picking a difficulty would set the track to undefined. */
  function wireChoices(row, key) {
    row.addEventListener("click", (e) => {
      const btn = e.target.closest("button.choice");
      if (!btn || btn.dataset[key] === undefined) return;
      // both track rows are one choice, so clear every card of this kind
      document.querySelectorAll(`#menu .choice[data-${key}]`)
        .forEach((c) => c.classList.remove("sel"));
      btn.classList.add("sel");
      state[key] = btn.dataset[key];
      Save.remember("math", state.track, state.mode);
      Sound.click();
    });
  }
  wireChoices(el.menu, "track");
  wireChoices(el.modeRow, "mode");
  // Start on whatever this hero played last, falling back to the defaults —
  // a kid who always plays one track shouldn't have to re-pick it every time.
  (function restoreChoices() {
    const me = Save.me();
    const restore = (key, want, fallback) => {
      const q = (v) => document.querySelector(`#menu .choice[data-${key}="${v}"]`);
      const btn = q(want) || q(fallback);
      btn.classList.add("sel");
      state[key] = btn.dataset[key];
    };
    restore("track", me && me.settings.lastTrack.math, "add");
    restore("mode", me && me.settings.modeByGame.math, "normal");
  })();

  // ---------- Problem generation ----------
  function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function pick(arr) { return arr[rand(0, arr.length - 1)]; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = rand(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Algebra: solve for x. ~30% of problems are two-step (a × x ± b = c); the
  // rest are one-step across all four operations. Every form resolves to a
  // single whole-number answer (the value of x) so it fits the number pad.
  function makeAlgebra() {
    if (Math.random() < 0.3) {
      // two-step: a × x + b = c  (or − b), with c kept positive
      const a = rand(2, 5), x = rand(2, 9);
      if (Math.random() < 0.5) {
        const b = rand(1, 9);
        return { text: `${a} × x + ${b} = ${a * x + b}`, answer: x };
      }
      const b = rand(1, Math.min(9, a * x - 1));
      return { text: `${a} × x − ${b} = ${a * x - b}`, answer: x };
    }
    // one-step, picked evenly across +, −, ×, ÷
    switch (rand(1, 6)) {
      case 1: { const x = rand(1, 12), b = rand(1, 12); return { text: `x + ${b} = ${x + b}`, answer: x }; }
      case 2: { const x = rand(1, 12), b = rand(1, 12); return { text: `${b} + x = ${x + b}`, answer: x }; }
      case 3: { const b = rand(1, 9), c = rand(1, 9); return { text: `x − ${b} = ${c}`, answer: b + c }; }
      case 4: { const x = rand(1, 9), c = rand(1, 9); return { text: `${x + c} − x = ${c}`, answer: x }; }
      case 5: { const a = rand(2, 9), x = rand(2, 9); return { text: `${a} × x = ${a * x}`, answer: x }; }
      default: { const a = rand(2, 9), c = rand(2, 9); return { text: `x ÷ ${a} = ${c}`, answer: a * c }; }
    }
  }

  // Every track is a function returning one problem:
  //     { text, answer }                  answered on the number pad
  //     { text, answer, choices: [...] }  answered by tapping a tile
  // For the number-blocks tracks (add / count / sub) it also sets state.a and
  // state.b, which is what renderBlocks() builds the towers from.
  const MAKERS = {
    add() {
      state.a = rand(1, 9); state.b = rand(1, 9);
      return { text: `${state.a} + ${state.b}`, answer: state.a + state.b };
    },

    // counting practice: show a number 1-30, type the one that comes next
    next() {
      state.a = rand(1, 30);
      return { text: `${state.a} →  ?`, answer: state.a + 1 };
    },

    // "count on": add only 1-3 to a starting number — a gentle step up from
    // counting toward addition. Uses the same push-together blocks as add.
    count() {
      state.a = rand(2, 9); state.b = rand(1, 3);
      return { text: `${state.a} + ${state.b}`, answer: state.a + state.b };
    },

    // single-digit take-away for the 5-year-old; keep the result >= 1 so
    // there's always something left to count after taking blocks away.
    sub() {
      state.a = rand(2, 9); state.b = rand(1, state.a - 1);
      return { text: `${state.a} − ${state.b}`, answer: state.a - state.b };
    },

    mul() {
      state.a = rand(2, 12); state.b = rand(2, 12);
      return { text: `${state.a} × ${state.b}`, answer: state.a * state.b };
    },

    // clean division, the inverse of the times tables: build the dividend
    // from two 2-12 factors so it always divides evenly (no remainder).
    div() {
      const divisor = rand(2, 12), quotient = rand(2, 12);
      state.a = divisor * quotient; state.b = divisor;
      return { text: `${state.a} ÷ ${state.b}`, answer: quotient };
    },

    alg: makeAlgebra,

    // ---------- Age 5: number sense ----------

    // Skip counting: 5, 10, 15, ? — 5s and 10s to start. Counting by 2s and
    // 3s unlocks after winning a battle on this track (progress.skipMastered),
    // because those are the harder step sizes to hear the pattern in.
    skip() {
      const me = Save.me();
      const steps = (me && me.progress.skipMastered) ? [2, 3, 5, 10] : [5, 10];
      const step = pick(steps);
      const start = step * rand(1, 4);
      const shown = [start, start + step, start + step * 2];
      return { text: shown.join(", ") + ", ?", answer: start + step * 3 };
    },

    // One more, one less — number-sense flexibility in both directions.
    oneless() {
      const n = rand(2, 20);
      const more = Math.random() < 0.5;
      return {
        text: `${n} →  one ${more ? "more" : "less"}?`,
        answer: more ? n + 1 : n - 1
      };
    },

    // Repeating patterns: red, blue, red, blue, ? — proto-algebra, the idea
    // that a pattern has a rule you can use to predict what comes next.
    pattern() {
      const shapes = ["🔴", "🔵", "🟡", "🟢", "🟣", "🟠", "⭐", "❤️"];
      const bag = shuffle(shapes);
      const shape = (i) => bag[i];
      // the repeating unit: AB, ABC, AAB, ABB, or AABB
      const unit = pick([[0, 1], [0, 1, 2], [0, 0, 1], [0, 1, 1], [0, 0, 1, 1]]);
      const seq = [];
      while (seq.length < Math.max(6, unit.length * 2)) {
        unit.forEach((u) => seq.push(u));
      }
      const nextIdx = unit[seq.length % unit.length];
      const answer = shape(nextIdx);
      const wrong = bag.slice(0, 3).filter((s) => s !== answer);
      return {
        text: seq.map(shape).join(" ") + "  ❓",
        answer: answer,
        choices: shuffle([answer, wrong[0], wrong[1] || bag[3]])
      };
    },

    // Sort It! — which one doesn't belong? Categorizing is the logic that
    // later math leans on, and it's a pure looking-and-thinking task.
    sort() {
      const g = pick(SORT_GROUPS);
      const three = shuffle(g.same).slice(0, 3);
      const odd = pick(g.odd);
      return {
        text: g.q,
        answer: odd,
        choices: shuffle(three.concat([odd]))
      };
    },

    // ---------- Age 6: everyday numbers ----------

    /* Make 10. The single most useful fact family at this age — knowing
       7 + 3 by heart is what makes every later mental sum possible. The
       blocks show the tower and the gap, so the child counts the space
       rather than being told the answer. */
    bonds() {
      state.a = rand(1, 9);
      state.b = 10 - state.a;
      return { text: `${state.a} + ?  = 10`, answer: state.b };
    },

    /* Counting coins: skip counting with mixed values, and a real-world
       skill. Kept to 1s, 5s and 10s so the totals stay countable, with a
       quarter only once he's past the easy ones. */
    coins() {
      const kinds = Save.me() && Save.me().progress.coinsMastered
        ? [1, 5, 10, 25] : [1, 5, 10];
      const purse = [];
      let total = 0;
      const n = rand(2, 5);
      for (let i = 0; i < n; i++) {
        const c = pick(kinds);
        // keep it countable for a six-year-old
        if (total + c > 60) break;
        purse.push(c);
        total += c;
      }
      if (!purse.length) { purse.push(1); total = 1; }
      // biggest first, the way you'd actually count them
      purse.sort((x, y) => y - x);
      state.coins = purse;
      return { text: "How much money?", answer: total };
    },

    /* Telling the time. O'clock and half past to begin with; quarters
       unlock the same way the harder skip-counting steps do. */
    clock() {
      const me = Save.me();
      const mins = (me && me.progress.clockMastered) ? [0, 30, 15, 45] : [0, 30];
      const h = rand(1, 12);
      const m = pick(mins);
      state.time = { h: h, m: m };

      const label = (hh, mm) => hh + ":" + String(mm).padStart(2, "0");
      const answer = label(h, m);

      // decoys: the same time on the wrong hour, and the wrong half of the
      // hour — both wrong for a reason the child can see on the face
      const otherH = h === 12 ? 1 : h + 1;
      const otherM = mins.filter((x) => x !== m);
      const decoys = [label(otherH, m), label(h, pick(otherM))];

      return {
        text: "What time is it?",
        answer: answer,
        choices: shuffle([answer].concat(decoys.filter((d) => d !== answer)))
      };
    },

    // ---------- Age 9: fractions ----------

    /* Fractions, the biggest thing a third-grader is taught and the one thing
       this site had nothing for. Three shapes of question, all of them read
       off bars he can see:

         compare      which is bigger, 3/4 or 2/5?
         equivalent   3/6 is the same as which?
         add          1/4 + 2/4, same denominator only

       The bars are the point. A fraction written down is an abstraction; a
       bar with three of four parts filled is a thing. As with the number
       blocks, the bars never show the answer — they show the question. */
    fract() {
      const kind = pick(["compare", "compare", "equiv", "add"]);
      // more parts than this and the bar stops being countable at a glance

      if (kind === "compare") {
        // halves through eighths, the denominators he actually meets
        const dens = [2, 3, 4, 5, 6, 8];
        let a, b;
        do {
          a = { n: 0, d: pick(dens) };
          b = { n: 0, d: pick(dens) };
          a.n = rand(1, a.d - 1);
          b.n = rand(1, b.d - 1);
        } while (a.n / a.d === b.n / b.d);   // never two that are equal
        state.bars = [a, b];
        const bigger = a.n / a.d > b.n / b.d ? a : b;
        return {
          text: "Which is bigger?",
          answer: `${bigger.n}/${bigger.d}`,
          choices: shuffle([`${a.n}/${a.d}`, `${b.n}/${b.d}`])
        };
      }

      if (kind === "equiv") {
        // A fraction and the same amount cut into smaller pieces. The scaled
        // bar has to stay countable — 1/5 tripled is 3/15, which is neither
        // readable nor drawable at this size — so only multiples that keep it
        // to ten parts or fewer are allowed.
        const base = pick([{ n: 1, d: 2 }, { n: 1, d: 3 }, { n: 1, d: 4 },
                           { n: 2, d: 3 }, { n: 3, d: 4 }, { n: 1, d: 5 }]);
        const ks = [2, 3, 4].filter((x) => base.d * x <= MAX_PARTS);
        const k = pick(ks);
        const shown = { n: base.n * k, d: base.d * k };
        state.bars = [shown];
        const answer = `${base.n}/${base.d}`;
        // decoys: right pieces wrong count, and right count wrong pieces
        const decoys = [`${base.n + 1}/${base.d}`, `${base.n}/${base.d + 1}`]
          .filter((x) => x !== answer);
        return {
          text: `${shown.n}/${shown.d} is the same as…`,
          answer: answer,
          choices: shuffle([answer].concat(decoys.slice(0, 2)))
        };
      }

      // adding with the same denominator, kept under a whole
      const d = pick([3, 4, 5, 6, 8]);
      const n1 = rand(1, d - 2);
      const n2 = rand(1, d - n1 - 1);
      state.bars = [{ n: n1, d: d }, { n: n2, d: d }];
      return {
        text: `${n1}/${d} + ${n2}/${d}`,
        answer: `${n1 + n2}/${d}`,
        choices: shuffle([
          `${n1 + n2}/${d}`,
          `${n1 + n2}/${d + d}`,          // the classic mistake: adding the bottoms
          `${Math.max(1, n1 + n2 - 1)}/${d}`
        ].filter((v, i, arr) => arr.indexOf(v) === i))
      };
    },

    /* Word problems: where the reading meets the arithmetic, and where a
       child who can do both separately often comes unstuck. Every one
       resolves to a positive whole number so it fits the number pad. */
    wordprob() {
      const who = pick(WP_NAMES);
      const [thing, things] = pick(WP_THINGS);
      const kind = pick(["add", "take", "times", "share", "twostep"]);

      if (kind === "add") {
        const a = rand(6, 40), b = rand(3, 30);
        return { text: `${who} had ${a} ${things} and found ${b} more. How many now?`,
                 answer: a + b };
      }
      if (kind === "take") {
        const a = rand(10, 45), b = rand(2, a - 1);
        return { text: `${who} had ${a} ${things} and gave ${b} away. How many are left?`,
                 answer: a - b };
      }
      if (kind === "times") {
        const bags = rand(2, 9), each = rand(2, 9);
        return { text: `${who} has ${bags} bags with ${each} ${things} in each. How many altogether?`,
                 answer: bags * each };
      }
      if (kind === "share") {
        const each = rand(2, 9), friends = rand(2, 8);
        return { text: `${who} shares ${each * friends} ${things} equally between ${friends} friends. How many each?`,
                 answer: each };
      }
      // two-step: buy several, then give some away
      const packs = rand(2, 6), each = rand(2, 8), gone = rand(1, packs * each - 1);
      return {
        text: `${who} bought ${packs} packs of ${each} ${things}, then lost ${gone}. How many are left?`,
        answer: packs * each - gone
      };
    },

    /* Big numbers: the mechanical arithmetic underneath everything else.
       Place value, carrying, borrowing and rounding. */
    place() {
      const kind = pick(["digit", "carry", "borrow", "round"]);

      if (kind === "digit") {
        const n = rand(100, 999);
        const spot = pick([
          ["ones", n % 10],
          ["tens", Math.floor(n / 10) % 10],
          ["hundreds", Math.floor(n / 100) % 10]
        ]);
        return { text: `In ${n}, which digit is in the ${spot[0]} place?`, answer: spot[1] };
      }
      /* Carrying and borrowing are built digit by digit rather than rolled and
         patched. Patching kept producing sums like 89 - 80, which need no
         borrow at all and so practise nothing. */
      if (kind === "carry") {
        const au = rand(1, 9);
        const bu = rand(10 - au, 9);        // units must cross ten
        const a = rand(1, 8) * 10 + au;
        const b = rand(1, 8) * 10 + bu;
        return { text: `${a} + ${b}`, answer: a + b };
      }
      if (kind === "borrow") {
        const au = rand(0, 8);
        const bu = rand(au + 1, 9);         // units of a smaller, so it must borrow
        const at = rand(2, 9);
        const bt = rand(1, at - 1);         // and the tens keep the result positive
        const a = at * 10 + au;
        const b = bt * 10 + bu;
        return { text: `${a} − ${b}`, answer: a - b };
      }
      const n = rand(11, 989);
      const to = pick([10, 100]);
      const rounded = Math.round(n / to) * to;
      return { text: `Round ${n} to the nearest ${to}`, answer: rounded };
    },

    /* Everyday maths: change, elapsed time and units — the applied arithmetic
       that turns up in shops and on clocks. */
    applied() {
      const kind = pick(["change", "elapsed", "units"]);

      if (kind === "change") {
        const paid = pick([50, 100, 200, 500]);
        const cost = rand(10, paid - 5);
        return { text: `A toy costs ${cost}¢. You pay ${paid}¢. How much change?`,
                 answer: paid - cost };
      }
      if (kind === "elapsed") {
        const h = rand(1, 11), m = pick([0, 10, 15, 20, 30, 40, 45]);
        const add = pick([10, 15, 20, 25, 30, 45]);
        const total = m + add;
        const endH = h + Math.floor(total / 60);
        const endM = total % 60;
        const label = (hh, mm) => hh + ":" + String(mm).padStart(2, "0");
        const answer = label(endH, endM);
        return {
          text: `It is ${label(h, m)}. What time is it ${add} minutes later?`,
          answer: answer,
          choices: shuffle([
            answer,
            label(endH, (endM + 10) % 60),
            label(endH === 12 ? 1 : endH + 1, endM)
          ].filter((v, i, arr) => arr.indexOf(v) === i))
        };
      }
      const unit = pick([
        ["How many centimetres in {n} metres?", 100],
        ["How many minutes in {n} hours?", 60],
        ["How many days in {n} weeks?", 7],
        ["How many millimetres in {n} centimetres?", 10]
      ]);
      const n = rand(2, 9);
      return { text: unit[0].replace("{n}", n), answer: n * unit[1] };
    },

    /* The Rematch. Not a generator at all — it deals back the questions that
       have beaten him, newest sting first, and retires one once he has had it
       right three times running.

       The queue is dealt at the start of a run and cycles if it is shorter
       than the fight, which is the point: these are the ones worth drilling.
       Every answer here goes into the same log, so a question retires itself
       just by being answered right. */
    rematch() {
      if (!state.queue || !state.queue.length) {
        state.queue = shuffle(Log.due("math", 40));
      }
      const item = state.queue.shift();
      if (!item) {
        // nothing owed: a friendly no-op rather than an empty screen
        return { text: "Nothing to beat! 🎉", answer: 0 };
      }
      state.rematchOf = item;
      return { text: item.q, answer: item.r };
    },

    // ---------- Age 8: find the rule ----------
    rule: makeRule
  };

  /* Word-problem casting. Names stay short so the sentence stays readable,
     and every object is something a child can picture a pile of. */
  const WP_NAMES = ["Sam", "Mia", "Ben", "Ava", "Leo", "Zoe", "Max", "Ida"];
  const WP_THINGS = [
    ["marble", "marbles"], ["sticker", "stickers"], ["apple", "apples"],
    ["coin", "coins"], ["card", "cards"], ["shell", "shells"],
    ["crayon", "crayons"], ["conker", "conkers"], ["bead", "beads"]
  ];

  // Sort It! content. Each group is a family of things that belong together
  // and a few that clearly don't. Authoring rule: the odd one must be odd for
  // exactly one obvious reason a 5-year-old can name out loud.
  const SORT_GROUPS = [
    { q: "Which is NOT an animal?", same: ["🐶", "🐱", "🐴", "🐸", "🐷", "🦊"], odd: ["🚗", "🍎", "⚽", "🏠"] },
    { q: "Which is NOT food?",      same: ["🍎", "🍌", "🍕", "🥕", "🍇", "🍞"], odd: ["🚲", "🐶", "⭐", "👟"] },
    { q: "Which does NOT go?",      same: ["🚗", "🚲", "✈️", "🚂", "🚌", "🚀"], odd: ["🍎", "🐱", "🏠", "⚽"] },
    { q: "Which is NOT red?",       same: ["🍎", "🍒", "🌹", "❤️", "🔴", "🚒"], odd: ["🔵", "🟢", "🟡", "🟣"] },
    { q: "Which is NOT round?",     same: ["⚽", "🏀", "🔴", "🍊", "🌕", "🪙"], odd: ["📕", "🚪", "🧊", "📦"] },
    { q: "Which is NOT big?",       same: ["🐘", "🐋", "🦕", "🚂", "🏔️", "🦒"], odd: ["🐜", "🐭", "🐝", "🪶"] },
    { q: "Which is NOT a number?",  same: ["1️⃣", "2️⃣", "3️⃣", "7️⃣", "9️⃣", "5️⃣"], odd: ["🅰️", "🐶", "⭐", "🍎"] },
  ];

  // Rule Hunter: a five-tier ladder from "what's the next number" up to
  // "what's the rule". The tier lives on the profile and steps up after
  // RULE_STEP correct answers, so the ladder is remembered between sessions.
  const RULE_STEP = 5;

  function ruleTier() {
    const me = Save.me();
    return Math.min(5, Math.max(1, (me && me.progress.seqTier) || 1));
  }

  // Called on every correct Rule Hunter answer; returns the new tier if the
  // hero just climbed one.
  function bumpRuleTier() {
    const me = Save.me();
    if (!me || state.track !== "rule") return null;
    const tier = ruleTier();
    if (tier >= 5) return null;
    const got = ((me.progress.seqCorrect || 0) + 1) % RULE_STEP;
    let climbed = null;
    Save.update((p) => {
      p.progress.seqCorrect = got;
      if (got === 0) { p.progress.seqTier = tier + 1; climbed = tier + 1; }
    });
    return climbed;
  }

  /* "the 8th number" reads as a position; "number 8" reads as a value. */
  function ordinal(n) {
    const teen = n % 100 >= 11 && n % 100 <= 13;
    const suffix = teen ? "th" : ({ 1: "st", 2: "nd", 3: "rd" })[n % 10] || "th";
    return n + suffix;
  }

  function makeRule() {
    const tier = ruleTier();

    if (tier === 1) {
      // one operation, always forwards: 3, 6, 9, ?
      const step = rand(2, 9), start = rand(1, 9);
      const seq = [start, start + step, start + step * 2];
      return { text: seq.join(", ") + ", ?", answer: start + step * 3 };
    }

    if (tier === 2) {
      // multiplicative: doubling and tripling. The leap from "add each time"
      // to "multiply each time" is the point of this rung.
      const mult = pick([2, 2, 3]);
      const start = rand(1, 4);
      const seq = [start, start * mult, start * mult * mult];
      return { text: seq.join(", ") + ", ?", answer: start * Math.pow(mult, 3) };
    }

    if (tier === 3) {
      // backwards and dividing, so "the next one is bigger" stops being a
      // safe guess
      if (Math.random() < 0.5) {
        const step = rand(2, 9), start = step * 4 + rand(1, 9);
        const seq = [start, start - step, start - step * 2];
        return { text: seq.join(", ") + ", ?", answer: start - step * 3 };
      }
      const div = pick([2, 3]);
      const answer = rand(1, 4);
      const seq = [answer * div * div * div, answer * div * div, answer * div];
      return { text: seq.join(", ") + ", ?", answer: answer };
    }

    if (tier === 4) {
      // two rules interleaved: 1, 2, 4, 5, 7, 8, ? — stretches working memory
      const a = rand(1, 4), b = rand(1, 4);
      const start = rand(1, 5);
      const seq = [start];
      for (let i = 0; i < 5; i++) seq.push(seq[i] + (i % 2 === 0 ? a : b));
      return { text: seq.join(", ") + ", ?", answer: seq[5] + a };
    }

    /* Tier 5: stop continuing the pattern. Either name it, or jump far ahead.

       The jump-ahead is the most valuable question on the whole ladder — it
       is the moment a child realises he doesn't have to write out every term
       to know one. But the arithmetic has to stay out of the way, or it
       becomes a mental-multiplication test instead: "8, 17, 26, 35 … what is
       number 10?" is 8 + 9x9, which swamps the idea it is trying to teach.

       So mostly the sequence is the multiples of its step, and the answer is
       a times-table fact he is already drilling next door — "7, 14, 21, 28 …
       the 8th number" is just 7 x 8. When there is an offset, the step is
       kept to 2, 5 or 10 and the target position stays close. */
    if (Math.random() < 0.5) {
      if (Math.random() < 0.75) {
        // the multiples of one number: the answer is step x position
        const step = pick([2, 3, 4, 5, 10]);
        const nth = rand(6, 12);
        const seq = [step, step * 2, step * 3, step * 4];
        return {
          text: seq.join(", ") + `, …   what is the ${ordinal(nth)} number?`,
          answer: step * nth
        };
      }
      // offset, but with a friendly step and a nearer target
      const step = pick([2, 5, 10]);
      const start = rand(1, 4);
      const nth = rand(5, 8);
      const seq = [start, start + step, start + step * 2, start + step * 3];
      return {
        text: seq.join(", ") + `, …   what is the ${ordinal(nth)} number?`,
        answer: start + step * (nth - 1)
      };
    }
    const step = rand(2, 9), start = rand(1, 9);
    const mult = pick([2, 3]);
    const adding = Math.random() < 0.5;
    const seq = adding
      ? [start, start + step, start + step * 2, start + step * 3]
      : [start, start * mult, start * mult * mult, start * mult * mult * mult];
    const answer = adding ? `add ${step}` : `times ${mult}`;
    // Candidate wrong rules, most tempting first. They can collide with each
    // other and with the answer (times 2 on a sequence starting at 2 makes
    // "add 2" twice), so take the first two that are actually distinct.
    const candidates = adding
      ? [`add ${step + 1}`, `times ${step}`, `take away ${step}`, `add ${step + 2}`]
      : [`times ${mult + 1}`, `add ${start * mult - start}`, `add ${mult}`,
         `times ${mult === 2 ? 4 : 2}`, `take away ${mult}`];
    const decoys = [];
    shuffle(candidates).forEach((c) => {
      if (decoys.length < 2 && c !== answer && decoys.indexOf(c) === -1) decoys.push(c);
    });
    return {
      text: seq.join(", ") + ", …   what is the RULE?",
      answer: answer,
      choices: shuffle([answer].concat(decoys))
    };
  }

  function newProblem() {
    if (state.track !== "rematch") state.rematchOf = null;
    const q = MAKERS[state.track]();
    state.answer = q.answer;
    state.choices = q.choices || null;
    el.question.textContent = q.text;
    el.question.classList.toggle("wordy", String(q.text).length > 22);
    el.answer.value = "";
    el.answer.className = "";
    renderAnswerMode();
    renderBlocks();
    if (!state.choices) el.answer.focus();
    startTimer();
  }

  // Some tracks are answered on the number pad, some by tapping a tile.
  // Only one of the two is on screen at a time.
  function renderAnswerMode() {
    const tapping = !!state.choices;
    el.answerRow.classList.toggle("hidden", tapping);
    el.keypad.classList.toggle("hidden", tapping);
    el.tiles.classList.toggle("hidden", !tapping);
    el.tiles.innerHTML = "";
    if (!tapping) return;
    state.choices.forEach((c) => {
      const b = document.createElement("button");
      // rule names are phrases ("take away 7"), not single glyphs
      b.className = "tile" + (String(c).indexOf(" ") !== -1 ? " word" : "");
      b.textContent = c;
      b.addEventListener("click", () => {
        if (state.busy) return;
        Sound.tap();
        resolveAnswer(c, b);
      });
      el.tiles.appendChild(b);
    });
  }

  /* ---------- How long a question gets ----------
     The mode sets the baseline, but a question is not a question: recalling
     7 x 8 is a different act from working out what rule turns 1, 2, 4, 5, 7, 8
     into the next number. Each track scales the clock by how much *thinking*
     it asks for, rather than everyone racing the times-table timer.

     1 is the times-table baseline. The blocks tracks are above it because the
     child is physically counting; Rule Hunter is furthest above because it is
     the only track that asks him to find a rule rather than recall a fact. */
  const TRACK_TIME = {
    next: 1.0, oneless: 1.0, mul: 1.0,
    div: 1.2,
    add: 1.4, sub: 1.4, count: 1.4,     // counting real blocks takes as long as it takes
    skip: 1.5, pattern: 1.5,            // sequencing: spot the step, then apply it
    sort: 1.5,                          // read the question, then compare four things
    alg: 1.8,                           // two-step algebra is pencil-and-paper work
    rule: 2.2,                          // find the rule, not the answer
    rematch: 1.8,                       // whatever it was, he found it hard once
    bonds: 1.4,                         // counting the gap in the blocks
    coins: 1.6,                         // count a handful of mixed values
    clock: 1.6,                         // read the hands, then match a time
    fract: 1.9,                         // read two bars, then compare them
    wordprob: 2.2,                      // read the whole thing, then work it out
    place: 1.5,                         // carrying and borrowing on paper in your head
    applied: 1.8                        // read it, then convert or count on
  };

  /* Rule Hunter's upper rungs are harder again — interleaved rules, and
     "what is the 10th number?" is arithmetic you have to plan. */
  const RULE_TIER_TIME = { 1: 1, 2: 1, 3: 1.1, 4: 1.3, 5: 1.6 };

  /* The most parts a fraction bar may be cut into. Past this it is neither
     countable at a glance nor drawable across the panel. */
  const MAX_PARTS = 10;

  /* How many digits the answer box accepts. Rounding to the nearest hundred
     can reach 1000, and a question whose answer cannot be typed is worse than
     no question at all — tracks.py asserts no track can exceed this. */
  const MAX_ANSWER_DIGITS = 4;

  /* The one place the clock is worked out. startTimer draws the bar from this
     and isFastAnswer judges the double-hit from it — computing them separately
     is how the white marker ends up disagreeing with the actual window. */
  function timing() {
    const m = MODES[state.mode];
    let scale = TRACK_TIME[state.track] || 1;
    if (state.track === "rule") scale *= RULE_TIER_TIME[ruleTier()] || 1;
    return {
      // a pet buys thinking time; an hourglass widens the double-hit window
      total: m.total * scale + GEAR.bonusTime + GEAR.fastBonus,
      fast: m.fast * scale + GEAR.fastBonus,
      penalty: m.penalty
    };
  }

  // ---------- Timer ----------
  // The Double Attack Timer: the bar is shown in every mode. While the bar is
  // still in the gold "fast" zone (left of the white marker has not been
  // reached) a correct answer lands a SUPER double hit.
  function startTimer() {
    stopTimer();
    const mode = timing();
    state.timerStart = performance.now();

    // place the marker at the boundary between the fast zone and the rest
    el.fastMarker.style.left = (1 - mode.fast / mode.total) * 100 + "%";
    el.timerBar.style.width = "100%";
    el.timerBar.className = "bar super";

    const tick = () => {
      const elapsed = performance.now() - state.timerStart;
      const left = Math.max(0, mode.total - elapsed);
      const pct = (left / mode.total) * 100;
      const isFast = elapsed < mode.fast;
      el.timerBar.style.width = pct + "%";
      el.timerBar.className = "bar" + (isFast ? " super" : pct < 25 ? " danger" : pct < 50 ? " warn" : "");
      el.superLabel.classList.toggle("show", isFast);
      if (left <= 0) {
        stopTimer();
        if (mode.penalty) timeUp();   // easy mode never punishes a slow answer
      } else {
        state.timerId = requestAnimationFrame(tick);
      }
    };
    state.timerId = requestAnimationFrame(tick);
  }

  // Was the answer given while the fast zone was still active?
  function isFastAnswer() {
    return (performance.now() - state.timerStart) < timing().fast;
  }

  function stopTimer() {
    if (state.timerId) cancelAnimationFrame(state.timerId);
    state.timerId = null;
    el.superLabel.classList.remove("show");
  }

  // ---------- HP pips ----------
  // HP is a small integer, so we draw it as countable pips (hearts for the
  // hero, orbs for the foe) instead of a continuous bar — easy to count along.
  function renderPips(container, cur, max, kind) {
    container.classList.toggle("many", max > 7);   // shrink a crowded row
    container.innerHTML = "";
    for (let i = 0; i < max; i++) {
      const p = document.createElement("span");
      p.className = "pip " + kind + (i < cur ? "" : " empty");
      container.appendChild(p);
    }
  }
  // The pet companion, shown beside the hero when one is equipped.
  function renderPet() {
    el.pet.textContent = GEAR.pet || "";
    el.pet.style.display = GEAR.pet ? "" : "none";
  }

  function renderHp() {
    const foe = FOES[state.foeIndex];
    renderPips(el.playerHp, state.playerHp, GEAR.maxHp, "heart");
    renderPips(el.foeHp, state.foeHp, foe.hp, "orb");
  }

  // ---------- Number blocks ----------
  function makeBlock(color) {
    const b = document.createElement("div");
    b.className = "block";
    b.style.background = color;
    return b;
  }

  function fillTower(tower, count, color) {
    tower.innerHTML = "";
    // Use as many rows as we have blocks, capped at 3 — so a short tower stays
    // short instead of reserving empty rows, and a tall one wraps into columns.
    tower.style.gridTemplateRows = `repeat(${Math.min(count, 3) || 1}, 38px)`;
    for (let i = 1; i <= count; i++) tower.appendChild(makeBlock(color));
  }

  /* The visual aid under the question. Which one appears depends on the
     track; every one of them follows the same rule as the number blocks —
     it helps the child work the answer out, and never shows it. */
  function renderBlocks() {
    state.merged = false;
    state.taken = false;
    el.coinRow.classList.add("hidden");
    el.clockBox.classList.add("hidden");
    el.barBox.classList.add("hidden");
    el.blocksRow.classList.remove("hidden");
    el.pushBtn.classList.remove("hidden");

    if (state.track === "bonds") {
      // the tower he has, then the gap to ten drawn as empty slots to count
      el.blocksArea.classList.remove("hidden");
      el.pushBtn.classList.add("hidden");
      el.plusSign.style.display = "";
      el.plusSign.style.visibility = "visible";
      el.plusSign.textContent = "+";
      el.towerB.style.display = "";
      el.towerA.className = "tower";
      el.towerB.className = "tower gap";
      el.towerA.style.cssText = "";
      el.towerB.style.cssText = "";
      fillTower(el.towerA, state.a, blockColor(state.a));
      fillTower(el.towerB, state.b, "transparent");
      [...el.towerB.children].forEach((b) => b.classList.add("hole"));
      return;
    }

    if (state.track === "coins") {
      el.blocksArea.classList.remove("hidden");
      el.blocksRow.classList.add("hidden");
      el.pushBtn.classList.add("hidden");
      el.coinRow.classList.remove("hidden");
      el.coinRow.innerHTML = "";
      state.coins.forEach((c) => {
        const d = document.createElement("button");
        d.className = "coin c" + c;
        d.innerHTML = `<span>${c}</span><small>¢</small>`;
        // tapping one pops it, the same way tapping a block does
        d.addEventListener("click", () => {
          Sound.blockTap();
          d.classList.remove("pop");
          void d.offsetWidth;
          d.classList.add("pop");
        });
        el.coinRow.appendChild(d);
      });
      return;
    }

    if (state.track === "fract") {
      el.blocksArea.classList.remove("hidden");
      el.blocksRow.classList.add("hidden");
      el.pushBtn.classList.add("hidden");
      el.barBox.classList.remove("hidden");
      drawBars(state.bars);
      return;
    }

    if (state.track === "clock") {
      el.blocksArea.classList.remove("hidden");
      el.blocksRow.classList.add("hidden");
      el.pushBtn.classList.add("hidden");
      el.clockBox.classList.remove("hidden");
      drawClock(state.time.h, state.time.m);
      return;
    }

    el.plusSign.textContent = "+";
    if (state.track === "add" || state.track === "count") {
      el.blocksArea.classList.remove("hidden");
      el.pushBtn.disabled = false;
      el.pushBtn.textContent = "👐 Push together";
      el.plusSign.style.display = "";
      el.plusSign.style.visibility = "visible";
      el.towerB.style.display = "";
      el.towerA.className = "tower";
      el.towerB.className = "tower";
      el.towerA.style.cssText = "";
      el.towerB.style.cssText = "";
      fillTower(el.towerA, state.a, blockColor(state.a));
      fillTower(el.towerB, state.b, blockColor(state.b));
    } else if (state.track === "sub") {
      // One tower = the minuend. The top `b` blocks are marked as the ones to
      // take away; pressing the button removes them and counts what's left.
      // The answer is never printed — the child counts the remaining blocks.
      el.blocksArea.classList.remove("hidden");
      el.pushBtn.disabled = false;
      el.pushBtn.textContent = `✋ Take ${state.b} away`;
      el.plusSign.style.display = "none";
      el.towerB.style.display = "none";
      el.towerA.className = "tower";
      el.towerA.style.cssText = "";
      fillTower(el.towerA, state.a, blockColor(state.a));
      const blocks = [...el.towerA.children];
      for (let i = state.a - state.b; i < state.a; i++) blocks[i].classList.add("remove-mark");
    } else {
      el.blocksArea.classList.add("hidden");
    }
  }

  function mergeTowers() {
    if (state.merged || (state.track !== "add" && state.track !== "count")) return;
    state.merged = true;
    Sound.push();

    el.plusSign.style.visibility = "hidden";

    // Tower B's blocks move onto tower A, each keeping its own color and its
    // own number so the two operands stay visually distinct in the combined
    // tower. Nothing prints the total, so the child has to count the blocks to
    // find the sum — the answer is never given away.
    el.towerA.style.transform = "";
    const sum = state.a + state.b;
    el.towerA.style.gridTemplateRows = `repeat(${Math.min(sum, 3) || 1}, 38px)`;
    while (el.towerB.firstChild) {
      el.towerA.appendChild(el.towerB.firstChild);
    }
    el.towerB.style.display = "none";   // now empty; hide the leftover box
    el.towerA.classList.remove("merged-pop");
    void el.towerA.offsetWidth;
    el.towerA.classList.add("merged-pop");

    el.pushBtn.disabled = true;
    el.pushBtn.textContent = "✓ Combined!";

    // count up, lighting one block at a time (no total shown)
    const blocks = [...el.towerA.children];
    let i = 0;
    const step = () => {
      if (i >= blocks.length || !state.merged) return;
      blocks[i].classList.add("count");
      Sound.count(i);
      i++;
      setTimeout(step, 170);
    };
    setTimeout(step, 250);
  }

  // Subtraction's take-away: remove the marked top `b` blocks one at a time,
  // then light up the remainder so the child can count what's left. As with
  // addition, the total is never shown.
  function takeAway() {
    if (state.taken || state.track !== "sub") return;
    state.taken = true;
    Sound.push();
    el.pushBtn.disabled = true;
    el.pushBtn.textContent = "✓ Taken away!";

    const toRemove = [...el.towerA.children].slice(state.a - state.b);
    toRemove.forEach((blk, i) => {
      setTimeout(() => {
        blk.classList.remove("remove-mark");
        blk.classList.add("removing");
        Sound.count(state.b - i);
      }, i * 160);
    });

    setTimeout(() => {
      if (!state.taken) return;
      toRemove.forEach((b) => b.remove());
      const left = state.a - state.b;
      el.towerA.style.gridTemplateRows = `repeat(${Math.min(left, 3) || 1}, 38px)`;
      el.towerA.classList.remove("merged-pop");
      void el.towerA.offsetWidth;
      el.towerA.classList.add("merged-pop");

      const rest = [...el.towerA.children];
      let i = 0;
      const step = () => {
        if (i >= rest.length || !state.taken) return;
        rest[i].classList.add("count");
        Sound.count(i);
        i++;
        setTimeout(step, 170);
      };
      setTimeout(step, 250);
    }, state.b * 160 + 250);
  }

  function rectsOverlap(elA, elB) {
    const a = elA.getBoundingClientRect();
    const b = elB.getBoundingClientRect();
    return !(a.right < b.left || b.right < a.left || a.bottom < b.top || b.bottom < a.top);
  }

  // Drag a tower; release it overlapping the other tower to push them together.
  let dragTower = null, dragStartX = 0, dragStartY = 0, dragMoved = 0;
  function attachDrag(tower) {
    tower.addEventListener("pointerdown", (e) => {
      if (state.merged || state.taken) return;
      dragTower = tower;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      dragMoved = 0;
      tower.classList.add("dragging");
      tower.setPointerCapture(e.pointerId);
    });
    tower.addEventListener("pointermove", (e) => {
      if (dragTower !== tower) return;
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      dragMoved = Math.max(dragMoved, Math.hypot(dx, dy));
      tower.style.transform = `translate(${dx}px, ${dy}px)`;
    });
    tower.addEventListener("pointerup", (e) => {
      if (dragTower !== tower) return;
      tower.classList.remove("dragging");
      dragTower = null;
      if (dragMoved < 6) {
        // a tap: pulse the tapped block so it can be counted
        if (e.target.classList.contains("block")) {
          e.target.classList.remove("pulse");
          void e.target.offsetWidth;
          e.target.classList.add("pulse");
          Sound.blockTap();
        }
        tower.style.transform = "";
        return;
      }
      if ((state.track === "add" || state.track === "count") && rectsOverlap(el.towerA, el.towerB)) mergeTowers();
      else tower.style.transform = ""; // snap back
    });
  }

  /* Fraction bars. A fraction written down is an abstraction; a bar with
     three of its four parts filled is a thing you can see is bigger than
     another. Each bar is labelled, and the parts are drawn as separate
     segments so the denominator is countable rather than implied. */
  function drawBars(bars) {
    el.barBox.innerHTML = "";
    bars.forEach((f) => {
      const row = document.createElement("div");
      row.className = "bar-row";

      const label = document.createElement("div");
      label.className = "bar-label";
      label.innerHTML = `<b>${f.n}</b><i></i><b>${f.d}</b>`;
      row.appendChild(label);

      const bar = document.createElement("div");
      bar.className = "frac-bar";
      for (let i = 0; i < f.d; i++) {
        const seg = document.createElement("span");
        seg.className = "seg" + (i < f.n ? " on" : "");
        // tapping a part pops it, so it can be counted like a block
        seg.addEventListener("click", () => {
          Sound.blockTap();
          seg.classList.remove("pop");
          void seg.offsetWidth;
          seg.classList.add("pop");
        });
        bar.appendChild(seg);
      }
      row.appendChild(bar);
      el.barBox.appendChild(row);
    });
  }

  /* A clock face. Drawn rather than written, because reading the hands is
     the whole skill — a digital time in the question would give it away. */
  function drawClock(h, m) {
    const R = 90, C = 100;
    const hand = (angleDeg, len, width, color) => {
      const a = (angleDeg - 90) * Math.PI / 180;
      return `<line x1="${C}" y1="${C}" x2="${C + Math.cos(a) * len}" ` +
             `y2="${C + Math.sin(a) * len}" stroke="${color}" ` +
             `stroke-width="${width}" stroke-linecap="round"/>`;
    };
    const ticks = [];
    for (let i = 1; i <= 12; i++) {
      const a = (i * 30 - 90) * Math.PI / 180;
      ticks.push(
        `<text x="${C + Math.cos(a) * (R - 20)}" y="${C + Math.sin(a) * (R - 20) + 6}" ` +
        `text-anchor="middle" font-size="18" font-family="var(--display)" ` +
        `fill="rgba(255,255,255,.85)">${i}</text>`);
    }
    el.clockBox.innerHTML =
      `<svg viewBox="0 0 200 200" width="150" height="150">` +
      `<circle cx="${C}" cy="${C}" r="${R}" fill="rgba(0,0,0,.3)" ` +
      `stroke="rgba(255,255,255,.5)" stroke-width="4"/>` +
      ticks.join("") +
      // the hour hand moves on through the hour, as a real one does
      hand((h % 12) * 30 + (m / 60) * 30, 46, 8, "#fff") +
      hand(m * 6, 68, 5, "var(--accent)") +
      `<circle cx="${C}" cy="${C}" r="6" fill="var(--accent)"/>` +
      `</svg>`;
  }

  // ---------- Animations ----------
  function floatText(text, color, atFoe) {
    const f = document.createElement("div");
    f.className = "float-text";
    f.textContent = text;
    f.style.color = color;
    const rect = el.arena.getBoundingClientRect();
    f.style.left = (atFoe ? rect.width * 0.72 : rect.width * 0.18) + "px";
    f.style.top = rect.height * 0.3 + "px";
    el.arena.appendChild(f);
    setTimeout(() => f.remove(), 1000);
  }

  function playSlash(atFoe) {
    const rect = el.arena.getBoundingClientRect();
    el.slash.style.left = (atFoe ? rect.width * 0.68 : rect.width * 0.18) + "px";
    el.slash.style.top = rect.height * 0.28 + "px";
    el.slash.textContent = atFoe ? GEAR.slash : "💢";
    el.slash.classList.remove("go");
    void el.slash.offsetWidth; // restart animation
    el.slash.classList.add("go");
  }

  function screenFlash() {
    el.flashOverlay.classList.remove("hit");
    void el.flashOverlay.offsetWidth;
    el.flashOverlay.classList.add("hit");
  }

  function animateAttack(attacker, defender, onImpact, onDone) {
    const atkSprite = attacker === "player" ? el.playerSprite : el.foeSprite;
    const defSprite = defender === "player" ? el.playerSprite : el.foeSprite;
    const atFoe = defender === "foe";

    atkSprite.classList.add("attack");
    setTimeout(() => {
      playSlash(atFoe);
      screenFlash();
      defSprite.classList.add("hurt", "flash");
      if (onImpact) onImpact();
      setTimeout(() => defSprite.classList.remove("flash"), 200);
    }, 180);
    setTimeout(() => {
      atkSprite.classList.remove("attack");
      defSprite.classList.remove("hurt");
      if (onDone) onDone();
    }, 600);
  }

  // ---------- Combat flow ----------
  // The Attack button: read the number pad, then resolve like any other answer.
  function playerAttack() {
    if (state.busy || state.choices) return;
    if (el.answer.value.trim() === "" || isNaN(parseInt(el.answer.value, 10))) {
      el.answer.classList.add("wrong");
      el.answer.focus();
      return;
    }
    resolveAnswer(parseInt(el.answer.value, 10), null);
  }

  // One path for both answer styles. `given` is the number typed on the pad or
  // the label of the tile tapped; `tile` is that tile, so it can be marked.
  function resolveAnswer(given, tile) {
    if (state.busy) return;
    state.busy = true;
    const took = performance.now() - state.timerStart;
    stopTimer();
    const right = String(given) === String(state.answer);
    // for the grown-ups: what was asked, what came back, and how long it took
    Log.answer({
      q: el.question.textContent, given: given, ok: right, ms: took,
      track: state.rematchOf ? state.rematchOf.track : null,
      // Only a typed question can be re-asked exactly as it was, so only
      // those carry their answer into the log for The Rematch to use.
      right: state.choices ? null : state.answer
    });

    if (right) {
      const isSuper = isFastAnswer();
      // a sharper weapon sometimes lands an extra point of damage
      const crit = !isSuper && Math.random() < GEAR.crit;
      // a boss fought on the road it fears takes more from every blow
      const weak = Save.weaknessBonus(state.node);
      const dmg = (isSuper ? GEAR.superDamage : PLAYER_DAMAGE + (crit ? 1 : 0)) + weak;
      if (tile) tile.classList.add("right"); else el.answer.className = "correct";
      Save.recordAnswer(true);
      Hud.applied(Save.awardEvent(isSuper ? "correctFast" : "correct"));
      const climbed = bumpRuleTier();
      if (climbed) Hud.queue({ kind: "level", level: climbed });
      if (isSuper) el.playerSprite.classList.add("super");
      animateAttack("player", "foe",
        () => {
          // the monsters fighting beside you each take their own swing
          const help = Allies.strike();
          state.foeHp = Math.max(0, state.foeHp - dmg - help);
          renderHp();
          if (isSuper) Sound.super(); else Sound.hit();
          if (help) setTimeout(() => {
            Sound.hit();
            floatText("+" + help + " from your friends!", "#7dd3fc", true);
          }, 240);
          if (isSuper) {
            floatText("DOUBLE! -" + dmg, "#ffd23f", true);
            setTimeout(() => { playSlash(true); screenFlash(); }, 160); // second hit
          } else {
            floatText((weak ? "WEAKNESS! -" : crit ? "CRIT! -" : "-") + dmg,
                      (weak || crit) ? "#ffd23f" : "#fff", true);
          }
        },
        () => {
          el.playerSprite.classList.remove("super");
          if (state.foeHp <= 0) return foeDefeated();
          state.busy = false;
          newProblem();
        }
      );
    } else {
      // wrong answer -> foe gets a hit. Costs no gold: progress only goes up.
      if (tile) {
        tile.classList.add("wrongPick");
        // show what it should have been, so a miss still teaches something
        [...el.tiles.children].forEach((t) => {
          if (t.textContent === String(state.answer)) t.classList.add("right");
        });
      } else {
        el.answer.className = "wrong";
      }
      Sound.wrong();
      Save.recordAnswer(false);
      wrongOrTimeout();
    }
  }

  function timeUp() {
    if (state.busy) return;
    state.busy = true;
    el.answer.className = "wrong";
    Sound.wrong();
    Save.recordAnswer(false);
    floatText("Too slow!", "#fbbf24", false);
    wrongOrTimeout();
  }

  function wrongOrTimeout() {
    setTimeout(() => {
      animateAttack("foe", "player",
        () => {
          if (state.shield > 0) {          // the pet blocks one hit per run
            state.shield--;
            Sound.click();
            floatText("BLOCKED!", "#5ce8a0", false);
            return;
          }
          state.playerHp = Math.max(0, state.playerHp - FOE_DAMAGE);
          renderHp();
          Sound.hurt();
          floatText("-" + FOE_DAMAGE, "#f87171", false);
        },
        () => {
          if (state.playerHp <= 0) return gameOver();
          state.busy = false;
          newProblem();
        }
      );
    }, 400);
  }

  function foeDefeated() {
    Sound.ko();
    floatText("KO!", "#ffd23f", true);
    Hud.applied(Save.awardEvent("foeDefeated"));
    // the monster you just beat may leave its collectible card behind
    const foe = FOES[state.foeIndex];
    Hud.cardDrop(Save.awardCard(foe.id));
    // ...and may decide it would rather fight beside you than against you
    state.joining = Save.rollAlly(foe, Allies.count());
    // the pet counts the monsters it has seen fall, and grows on the way
    const grown = Save.growPet();
    if (grown) { GEAR = Save.loadout(); renderPet(); Hud.queue({ kind: "pet", stage: grown }); }
    el.foeSprite.style.transition = "transform .6s, opacity .6s";
    el.foeSprite.style.transform = "scaleX(-1) scale(0) rotate(360deg)";
    el.foeSprite.style.opacity = "0";

    setTimeout(() => {
      state.foeIndex++;
      if (state.foeIndex >= FOES.length) return win();
      // Anything earned fighting that monster opens now, while there's no
      // question on screen for it to cover. The next monster waits for it.
      Hud.flush(nextFoe);
    }, 900);
  }

  function nextFoe() {
    if (state.joining) {
      const pal = state.joining;
      state.joining = null;
      Allies.add(pal);
      Sound.levelUp();
      floatText(pal.emoji + " " + pal.name + " joined you!", "#7dd3fc", false);
    }
    setupFoe();
    el.foeSprite.style.transition = "transform .5s, opacity .5s";
    el.foeSprite.style.transform = "scaleX(-1) scale(1)";
    el.foeSprite.style.opacity = "1";
    floatText("New foe!", "#fff", true);
    state.busy = false;
    newProblem();
  }

  function setupFoe() {
    const foe = FOES[state.foeIndex];
    state.foeHp = foe.hp;
    el.foeSprite.textContent = foe.emoji;
    el.foeSprite.style.setProperty("--foe-scale", foe.scale || 1);
    el.foeName.textContent = foe.emoji + " " + foe.name;
    renderHp();
  }

  // ---------- Screen transitions ----------
  function showScreen(id) {
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("show"));
    document.getElementById(id).classList.add("show");
  }

  function startGame() {
    Sound.unlock();
    Sound.click();
    Save.setContext("math");     // the world's gold multiplier applies here
    Log.startSession({ game: "math", track: state.track, mode: state.mode });
    state.queue = state.track === "rematch" ? shuffle(Log.due("math", 40)) : null;
    state.mapReturn = null;
    // a boss stop is one named monster with a lot of hearts, not the lineup
    FOES = (state.node && state.node.boss && state.node.foe)
      ? [state.node.foe]
      : Save.foesFor("math");
    GEAR = Save.loadout();
    renderPet();
    state.playerHp = GEAR.maxHp;
    state.shield = GEAR.shield;
    // double gold applies to this run only, so a game played afterwards from
    // the menu pays the normal rate
    Save.setDailyRun(!!state.daily);
    Save.touchDay();
    state.joining = null;
    Allies.reset();          // allies last the run, not forever
    state.foeIndex = 0;
    state.busy = false;
    state.goldAtStart = (Save.me() || { gold: 0 }).gold;
    el.foeSprite.style.transform = "scaleX(-1) scale(1)";
    el.foeSprite.style.opacity = "1";
    setupFoe();
    renderHp();
    el.battle.classList.toggle("with-blocks", BLOCK_TRACKS.indexOf(state.track) !== -1);
    el.nodeBar.classList.toggle("hidden", !state.node);
    if (state.node) {
      el.nodeBar.textContent = state.node.boss
        ? `⚔️ BOSS — ${state.node.foe.name}`
        : `🗺️ Stop ${state.node.i + 1} — ${state.node.label}`;
    }
    showScreen("battle");
    newProblem();
  }

  function win() {
    stopTimer();
    const node = state.node ? Save.completeNode() : null;
    Save.recordRunWon("math");
    // beating a whole run of skip counting unlocks the harder step sizes
    if (state.track === "skip") Save.update((p) => { p.progress.skipMastered = true; });
    const bonus = Save.awardEvent("runWon");
    // today's challenge counts once it's beaten, not once it's started
    const daily = state.daily ? Save.claimDaily() : false;
    el.endEmoji.textContent = daily ? "⭐" : "🏆";
    el.endTitle.textContent = daily ? "Challenge beaten!" : "Victory!";
    el.endText.textContent = daily
      ? "Today's challenge is done — everything paid double."
      : node && node.advanced
      ? "Stop " + (node.i + 1) + " beaten! The path goes on."
      : "You defeated every monster. You're a math hero!";
    showEarnings();
    // a beaten map stop pays out on the map, where the walk and the chest are
    state.mapReturn = node && node.advanced ? node : null;
    el.playAgainBtn.textContent = state.mapReturn ? "🗺️ Back to the map" : "Play Again";
    Sound.win();
    Log.endSession({ won: true, gold: earnedThisRun() });
    showScreen("endScreen");
    Hud.applied(bonus);
    Hud.flush();          // nothing left to cover here
  }

  function gameOver() {
    stopTimer();
    showEarnings();
