<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>save.js tests</title>
<style>
  body { font-family: ui-monospace, Menlo, Consolas, monospace; background: #12091f; color: #eee;
         padding: 24px; line-height: 1.6; }
  .pass { color: #5ce8a0; }
  .fail { color: #ff5e7e; font-weight: bold; }
  h1 { font-size: 20px; }
  #summary { margin-top: 18px; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>
<h1>shared/save.js</h1>
<div id="out"></div>
<div id="summary"></div>

<script src="../shared/save.js"></script>
<script>
/* Assertions over the save layer. Open this file in a browser, or drive it
   headlessly and read window.RESULT / #summary. It clobbers the real save, so
   it stashes and restores whatever was there. */
'use strict';

var stash = localStorage.getItem(Save._key);
var pass = 0, fail = 0;

function ok(label, cond, detail) {
  var d = document.createElement('div');
  d.className = cond ? 'pass' : 'fail';
  d.textContent = (cond ? 'PASS  ' : 'FAIL  ') + label + (cond || !detail ? '' : '   -- ' + detail);
  document.getElementById('out').appendChild(d);
  cond ? pass++ : fail++;
}

function fresh() {
  Save.reset();
  return Save.createProfile('Tester', '🦖');
}

try {
  /* ---------- profiles ---------- */
  Save.reset();
  ok('no active profile on a blank save', Save.me() === null);
  ok('blank save lists no profiles', Save.profiles().length === 0);

  var a = Save.createProfile('Alpha', '🦊');
  ok('creating a profile makes it active', Save.me() !== null && Save.me().name === 'Alpha');
  var b = Save.createProfile('Beta', '🐯');
  ok('second profile becomes active', Save.me().name === 'Beta');
  ok('both profiles are listed', Save.profiles().length === 2);

  Save.setActive(a);
  ok('switching back to the first profile works', Save.me().name === 'Alpha');
  ok('switching to a bogus id is refused', Save.setActive('nope') === false);

  Save.renameProfile(a, 'Alpha2', '🐸');
  ok('renaming works', Save.me().name === 'Alpha2' && Save.me().avatar === '🐸');

  Save.deleteProfile(b);
  ok('deleting a profile removes it', Save.profiles().length === 1);

  /* Profiles must not share state — the whole point of per-kid saves. */
  fresh();
  var p1 = Save.createProfile('Kid1', '🦸');
  Save.award(50, 50);
  var p2 = Save.createProfile('Kid2', '🦹');
  ok("a new profile starts at zero gold", Save.me().gold === 0);
  Save.setActive(p1);
  ok("the other profile kept its gold", Save.me().gold === 50);

  /* ---------- levels ---------- */
  fresh();
  ok('a new hero is level 1 with 0 xp', Save.levelOf(Save.me()).level === 1);
  ok('level 1 needs 100 xp', Save.levelOf(Save.me()).need === 100);

  var r = Save.award(0, 99);
  ok('99 xp is still level 1', Save.levelOf(Save.me()).level === 1);
  ok('no level-up reported below the threshold', r.leveledTo === null);

  r = Save.award(0, 1);
  ok('100 xp reaches level 2', Save.levelOf(Save.me()).level === 2);
  ok('the level-up is reported', r.leveledTo === 2);
  ok('level 2 costs more than level 1', Save.levelOf(Save.me()).need === 150);
  ok('progress into the level resets', Save.levelOf(Save.me()).into === 0);

  Save.award(0, 149);
  ok('249 xp is still level 2', Save.levelOf(Save.me()).level === 2);
  Save.award(0, 1);
  ok('250 xp reaches level 3', Save.levelOf(Save.me()).level === 3);

  /* A single huge award must skip through the levels correctly. */
  fresh();
  r = Save.award(0, 100 + 150 + 200);
  ok('one big award lands on the right level', Save.levelOf(Save.me()).level === 4, 'got ' + Save.levelOf(Save.me()).level);
  ok('the multi-level jump is reported', r.leveledTo === 4);

  /* ---------- earning ---------- */
  fresh();
  Save.awardEvent('correct');
  ok('a correct answer pays the table rate',
     Save.me().gold === Save.ECONOMY.correct.gold && Save.me().xp === Save.ECONOMY.correct.xp);
  Save.awardEvent('nosuchevent');
  ok('an unknown event pays nothing', Save.me().gold === Save.ECONOMY.correct.gold);

  fresh();
  Save.recordAnswer(true); Save.recordAnswer(true); Save.recordAnswer(false);
  ok('correct answers are counted', Save.me().stats.correct === 2);
  ok('wrong answers are counted', Save.me().stats.wrong === 1);
  ok('a wrong answer breaks the streak', Save.me().stats.streak === 0);
  ok('the best streak is remembered', Save.me().stats.bestStreak === 2);

  /* ---------- shop ---------- */
  fresh();
  ok('a new hero starts with the stick and tunic',
     Save.owns('stick') && Save.owns('tunic'));
  ok('buying with no gold is refused', Save.buy('sword') === 'broke');
  ok('the refused purchase cost nothing', Save.me().gold === 0);

  Save.award(20000, 0);   // enough for several tiers; prices get retuned
  ok('buying with enough gold works', Save.buy('sword') === 'ok');
  ok('the gold was actually spent', Save.me().gold === 20000 - Save.item('sword').cost);
  ok('the item is owned', Save.owns('sword'));
  ok('buying it twice is refused', Save.buy('sword') === 'owned');
  ok('a purchased weapon is equipped', Save.me().inventory.weapon === 'sword');
  ok('buying something that does not exist is refused', Save.buy('unicorn-cannon') === 'nosuch');

  Save.buy('vest');
  ok('armor raises max hearts', Save.loadout().maxHp === 6);
  Save.buy('chick');
  ok('a pet adds thinking time', Save.loadout().bonusTime === 2000);
  ok('a pet shows up in the arena', Save.loadout().pet === '🐣');
  Save.buy('flame');
  ok('the flame blade upgrades double hits', Save.loadout().superDamage === 3);

  /* ---------- the two later slots ----------
     Helms and boots were added after four slots had been shipping for
     months, so the thing worth proving is that they ADD to what the
     originals set rather than replacing it — a helm and a trinket that both
     widen the DOUBLE window have to stack, or the dearer one silently does
     nothing. */
  var beforeHelm = Save.loadout();
  Save.buy('ironhelm');
  ok('a helm is equipped when bought', Save.me().inventory.helm === 'ironhelm');
  ok('a helm widens the DOUBLE window',
     Save.loadout().fastBonus === beforeHelm.fastBonus + Save.item('ironhelm').fastBonus,
     beforeHelm.fastBonus + ' -> ' + Save.loadout().fastBonus);

  var beforeBoots = Save.loadout();
  Save.buy('hideboots');
  ok('boots are equipped when bought', Save.me().inventory.boots === 'hideboots');
  ok('boots add thinking time on top of the pet',
     Save.loadout().bonusTime === beforeBoots.bonusTime + Save.item('hideboots').bonusTime,
     beforeBoots.bonusTime + ' -> ' + Save.loadout().bonusTime);
  ok('boots add gold on top of the trinket',
     Math.abs(Save.loadout().goldBonus -
              (beforeBoots.goldBonus + Save.item('hideboots').goldBonus)) < 1e-9);

  // a trinket that also widens the window must stack with the helm, not
  // overwrite it — this is the bug the slot ordering in loadout() invites
  Save.update(function (p) { p.gold = 99999; });
  Save.buy('hourglass');
  ok('helm and trinket both widen the window',
     Save.loadout().fastBonus ===
       Save.item('ironhelm').fastBonus + Save.item('hourglass').fastBonus,
     'got ' + Save.loadout().fastBonus);

  /* Adding these slots deliberately did NOT bump the schema: a save written
     before they existed has no `helm` or `boots` key at all, and must load
     and play exactly as it did. If this ever fails, the slots need a
     migration after all. */
  Save.update(function (p) {
    delete p.inventory.helm;
    delete p.inventory.boots;
  });
  var oldShape = Save.loadout();
  ok('a save from before these slots still loads', !!oldShape);
  ok('...and simply wears nothing in them',
     oldShape.fastBonus === Save.item('hourglass').fastBonus,
     'got ' + oldShape.fastBonus);
  Save.buy('shoes');
  ok('...and can still be given boots afterwards',
     Save.me().inventory.boots === 'shoes');

  Save.equip('sword');
  ok('equipping an owned weapon works', Save.me().inventory.weapon === 'sword');
  ok('equipping an unowned item is refused', Save.equip('axe') === false);

  /* ---------- the v2 economy ---------- */
  fresh();
  ok('a new hero has a trinket slot', Save.me().inventory.trinket === null);

  // every tier of every slot must be reachable, or a price is a typo
  ['weapon', 'armor', 'pet', 'trinket'].forEach(function (kind) {
    var tiers = Save.SHOP.filter(function (i) { return i.kind === kind; });
    ok(kind + ': has at least 5 tiers', tiers.length >= 5, 'got ' + tiers.length);
    var costs = tiers.map(function (i) { return i.cost; });
    var sorted = costs.slice().sort(function (a, b) { return a - b; });
    ok(kind + ': tiers are priced in ascending order',
       JSON.stringify(costs) === JSON.stringify(sorted), costs.join(','));
    ok(kind + ': exactly one tier is gated on a card set',
       tiers.filter(function (i) { return i.set; }).length === 1);
  });

  // the set-gated top tier must refuse gold alone
  fresh();
  Save.award(999999, 0);
  var gated = Save.SHOP.filter(function (i) { return i.set; });
  ok('every set-gated item names a real world',
     gated.every(function (i) { return !!Save.world(i.set); }));
  ok('a set-gated item is refused however rich you are',
     gated.every(function (i) { return Save.buy(i.id) === 'noset'; }));
  ok('the refusal spent nothing', Save.me().gold === 999999);

  // ...and accept once the set is held
  fresh();
  Save.award(999999, 0);
  var reef = Save.world('reef');
  reef.foes.math.concat(reef.foes.language).forEach(function (f) {
    Save.update(function (p) { p.cards[f.id] = 1; });
  });
  ok('holding every card completes the set', Save.hasSet('reef') === true);
  ok('a completed set appears in setsHeld', Save.setsHeld().indexOf('reef') !== -1);
  var reefItem = Save.SHOP.filter(function (i) { return i.set === 'reef'; })[0];
  ok('the set-gated item can now be bought', Save.buy(reefItem.id) === 'ok');
  ok('a finished set grants a permanent heart', Save.loadout().maxHp >= 6);

  // world gold multipliers
  fresh();
  Save.setContext('math');
  ok('the starting world pays the base rate', Math.abs(Save.goldRate() - 1) < 0.001);
  Save.award(1000000, 0);
  Save.buy('world-ember');
  Save.setWorld('ember');
  ok('a harder world pays more',
     Math.abs(Save.goldRate() - Save.world('ember').gold) < 0.001,
     'rate ' + Save.goldRate());
  Save.setContext('story');
  ok("Story Quest doesn't get the world multiplier",
     Math.abs(Save.goldRate() - 1) < 0.001, 'rate ' + Save.goldRate());

  // the award actually pays the multiplied amount
  fresh();
  Save.setContext('math');
  Save.award(1000000, 0);
  Save.buy('world-cave');
  Save.setWorld('cave');
  var before = Save.me().gold;
  var paid = Save.award(100, 0);
  ok('the multiplier is applied when paying out',
     paid.gold === Math.round(100 * Save.world('cave').gold),
     'paid ' + paid.gold);
  ok('the banked gold matches what was reported',
     Save.me().gold === before + paid.gold);

  // a trinket's gold bonus stacks on top
  fresh();
  Save.setContext('math');
  Save.award(1000000, 0);
  Save.buy('coin');
  ok('a lucky coin raises the rate',
     Save.goldRate() > 1, 'rate ' + Save.goldRate());

  /* ---------- migration from v1 ---------- */
  Save.reset();
  var v1 = {
    v: 1, active: 'old',
    profiles: { old: { name: 'Veteran', avatar: '🦊', xp: 400, gold: 500,
      inventory: { owned: ['stick', 'tunic'], weapon: 'stick', armor: 'tunic', pet: null, tokens: 2 },
      cards: { 'm-slime': 3 },
      progress: { world: 'meadow', unlockedWorlds: ['meadow'], runsWon: {}, questsDone: [], seqTier: 2 },
      settings: { modeByGame: {}, lastTrack: {} },
      stats: { correct: 10, wrong: 2, streak: 0, bestStreak: 5 } } }
  };
  localStorage.setItem(Save._key, JSON.stringify(v1));
  Save._reload();
  ok('a v1 save still loads', Save.me() && Save.me().name === 'Veteran');
  ok('gold is scaled by the rebalance factor',
     Save.me().gold === 500 * Save._goldScale, 'got ' + Save.me().gold);
  ok('the migration adds the trinket slot', Save.me().inventory.trinket === null);
  ok('the migration keeps what was already earned',
     Save.me().xp === 400 && Save.me().cards['m-slime'] === 3 &&
     Save.me().inventory.tokens === 2);
  ok('the save is stamped with the new version', Save.load().v === Save._version);
  ok('the new version was written to storage',
     JSON.parse(localStorage.getItem(Save._key)).v === Save._version);

  // running it twice must not pay twice
  var afterFirst = Save.me().gold;
  Save._reload();
  ok('the migration does not run a second time',
     Save.me().gold === afterFirst, 'got ' + Save.me().gold);

  /* ---------- worlds ---------- */
  fresh();
  Save.award(100000, 0);   // enough for any world; prices get retuned
  ok('only the meadow is unlocked at first', Save.me().progress.unlockedWorlds.length === 1);
  ok('a locked world cannot be selected', Save.setWorld('cave') === false);
  Save.buy('world-cave');
  ok('buying a world unlocks it', Save.me().progress.unlockedWorlds.indexOf('cave') !== -1);
  ok('an unlocked world can be selected', Save.setWorld('cave') === true);
  ok('the foe lineup follows the world', Save.foesFor('math')[0].id === 'm-crab');
  ok('math fights four monsters', Save.foesFor('math').length === 4);
  ok('language fights five', Save.foesFor('language').length === 5);

  /* ---------- tokens ---------- */
  fresh();
  ok('no tokens to start', Save.useToken() === false);
  Save.award(100000, 0);
  Save.buy('ipad');
  ok('a token can be bought', Save.me().inventory.tokens === 1);
  ok('tokens can be bought more than once', Save.buy('ipad') === 'ok');
  ok('two tokens are held', Save.me().inventory.tokens === 2);
  ok('spending a token works', Save.useToken() === true);
  ok('the token was consumed', Save.me().inventory.tokens === 1);

  /* ---------- cards: rarity, pity, foils ---------- */
  fresh();
  ok('awarding no card id is a no-op', Save.awardCard(null) === null);
  ok('a forced award always drops', !!Save.awardCard('m-slime', true));
  ok('the card is held once', Save.held('m-slime') === 1);

  /* Drop rate. Every roll here is against the same common monster, and the
     pity counter is reset each time so it can't skew the measurement — this
     is the natural rate on its own. */
  function measureRate(cardId, rolls) {
    var hits = 0;
    for (var i = 0; i < rolls; i++) {
      Save.update(function (p) { p.progress.koSinceCard = 0; });
      if (Save.awardCard(cardId)) hits++;
    }
    return hits / rolls;
  }

  fresh();
  var N = 4000;
  var common = measureRate('m-slime', N);      // rarity 1
  var want = Save.ECONOMY.cardChance;
  ok('a common card drops near its configured rate',
     Math.abs(common - want) < 0.03, 'got ' + common.toFixed(3) + ', want ' + want);

  fresh();
  var legend = measureRate('m-dragon', N);     // rarity 3
  var wantL = Save.ECONOMY.cardChance * Save.ECONOMY.cardRarityOdds[3];
  ok('a legendary drops far less often',
     Math.abs(legend - wantL) < 0.02, 'got ' + legend.toFixed(3) + ', want ' + wantL);
  ok('legendaries are rarer than commons', legend < common / 2);

  /* Cards must be RARE — the whole point of the change. At the configured
     rate a run of four monsters should usually pay nothing. */
  ok('most monsters drop nothing', common < 0.25, 'rate ' + common.toFixed(3));

  /* The pity counter is the floor: go this many monsters with no drop and the
     next one is certain. */
  fresh();
  var pityAt = Save.ECONOMY.cardPity;
  Save.update(function (p) { p.progress.koSinceCard = pityAt - 1; });
  ok('the pity counter forces a drop', !!Save.awardCard('m-dragon'));
  ok('a drop resets the pity counter', Save.me().progress.koSinceCard === 0);

  fresh();
  var longest = 0, since = 0;
  for (var i = 0; i < 2000; i++) {
    if (Save.awardCard('m-dragon')) { since = 0; } else { since++; longest = Math.max(longest, since); }
  }
  ok('no drought ever runs past the pity limit',
     longest < pityAt, 'longest drought ' + longest + ', limit ' + pityAt);

  /* Foils */
  fresh();
  var foils = 0, drops = 0;
  for (var i = 0; i < 3000; i++) {
    var d2 = Save.awardCard('m-slime', true);
    drops++;
    if (d2.foil) foils++;
  }
  var foilRate = foils / drops;
  ok('foils land near their configured rate',
     Math.abs(foilRate - Save.ECONOMY.foilChance) < 0.025,
     'got ' + foilRate.toFixed(3) + ', want ' + Save.ECONOMY.foilChance);
  ok('foils are counted separately from plain copies',
     Save.foilsOf('m-slime') === foils && Save.held('m-slime') === drops);

  ok('a repeat is reported as a duplicate',
     Save.awardCard('m-slime', true).how === 'dupe');
  fresh();
  ok('a first catch is reported as new',
     Save.awardCard('m-bat', true).how === 'new');

  /* ---------- the trader ---------- */
  fresh();
  ok('nothing to sell with a single copy', Save.spares('m-slime') === 0);
  for (var i = 0; i < 4; i++) Save.awardCard('m-slime', true);
  ok('everything past the first copy is spare', Save.spares('m-slime') === 3);

  var goldBefore = Save.me().gold;
  var paid = Save.sellSpares('m-slime');
  ok('selling spares pays gold', paid > 0);
  ok('the gold arrived', Save.me().gold === goldBefore + paid);
  ok('one copy is always kept', Save.held('m-slime') === 1);
  ok('selling again pays nothing', Save.sellSpares('m-slime') === 0);

  // rarity sets the price
  ok('a legendary spare is worth more than a common',
     Save.spareValue('m-dragon') > Save.spareValue('m-slime'));

  // a foil is worth more, and is spent last
  fresh();
  Save.update(function (p) { p.cards['m-slime'] = 3; p.foils['m-slime'] = 1; });
  var withFoil = Save.spareList()[0].gold;
  fresh();
  Save.update(function (p) { p.cards['m-slime'] = 3; });
  var without = Save.spareList()[0].gold;
  ok('a foil spare is worth more than a plain one', withFoil > without,
     withFoil + ' vs ' + without);

  /* Trading a pile of spares for a card you're missing — the guarantee that a
     collection can always be finished by playing, not only by luck. */
  fresh();
  ok('trading with no spares is refused', Save.tradeForCard('m-dragon') === 'short');
  ok('the refusal left the card uncollected', Save.held('m-dragon') === 0);

  var cost = Save.ECONOMY.wildCardCost;
  Save.update(function (p) { p.cards['m-slime'] = cost + 1; });
  ok('enough spares are counted', Save.spareCount() >= cost);
  ok('trading for a missing card works', Save.tradeForCard('m-dragon') === 'ok');
  ok('the traded card is held', Save.held('m-dragon') === 1);
  ok('the spares were spent', Save.spareCount() < cost);
  ok('trading for one you already have is refused',
     Save.tradeForCard('m-dragon') === 'have');
  ok('trading for a card that does not exist is refused',
     Save.tradeForCard('not-a-card') === 'nosuch');

  ok('missing cards are listed', Save.missingCards().length > 0);
  ok('a held card is not listed as missing',
     Save.missingCards().every(function (c) { return c.id !== 'm-dragon'; }));

  /* ---------- set perks ---------- */
  fresh();
  var baseHp = Save.loadout().maxHp;
  var meadow = Save.world('meadow');
  meadow.foes.math.concat(meadow.foes.language).forEach(function (f) {
    Save.update(function (p) { p.cards[f.id] = 1; });
  });
  ok('finishing the meadow set is detected', Save.hasSet('meadow'));
  ok('the meadow perk adds a heart', Save.loadout().maxHp === baseHp + 1);
  ok('every world has a set perk',
     Save.WORLDS.every(function (w) { return !!Save.SET_PERKS[w.id]; }));
  ok('set progress reports the meadow as done',
     Save.setProgress().filter(function (sp) { return sp.id === 'meadow'; })[0].done);
  ok('set progress counts partial worlds',
     Save.setProgress().filter(function (sp) { return sp.id === 'ember'; })[0].got === 0);

  var cards = Save.allCards();
  ok('every world, story and robot card is listed',
     cards.length === Save.WORLDS.length * 9 + Save.STORY_CARDS.length +
                      Save.ROBOT_CARDS.length,
     'got ' + cards.length);
  // Every card must say where it came from, because the Cards screen shelves
  // them by exactly that string and a card with no home is a card nobody can
  // find. The two combat-free games are the ones that have to say it out loud.
  ok('the robot cards shelve under the Robot Workshop',
     Save.ROBOT_CARDS.every(function (c) {
       var got = cards.filter(function (x) { return x.id === c.id; })[0];
       return got && got.from === 'Robot Workshop' && got.game === 'robot';
     }));
  var ids = cards.map(function (c) { return c.id; });
  ok('card ids are unique across the site', new Set(ids).size === ids.length);
  ok('every card carries its rarity',
     cards.every(function (c) { return c.r >= 1 && c.r <= 3; }));

  // this block stands on its own rather than inheriting an earlier test's cards
  fresh();
  Save.awardCard('m-slime', true);
  Save.awardCard('m-slime', true);
  cards = Save.allCards();
  ok('held counts come through',
     cards.filter(function (c) { return c.id === 'm-slime'; })[0].count === 2);
  ok('uncaught monsters read zero',
     cards.filter(function (c) { return c.id === 'l-titan'; })[0].count === 0);

  /* ---------- the map ---------- */
  fresh();
  ok('both trails have stops',
     Save.MAP.little.length > 10 && Save.MAP.big.length > 10);
  ok('a new hero starts at the beginning of both trails',
     Save.mapAt('little') === 0 && Save.mapAt('big') === 0);

  ok('the first stop is playable', Save.nodeState('little', 0) === 'next');
  ok('the second is locked', Save.nodeState('little', 1) === 'locked');
  ok('a far stop is locked', Save.nodeState('little', 5) === 'locked');

  ok('a locked stop cannot be started', Save.startNode('little', 3) === false);
  ok('nothing is armed after a refused start', Save.activeNode() === null);

  ok('the next stop can be started', Save.startNode('little', 0) === true);
  var node = Save.activeNode();
  ok('the armed stop knows its game', !!node && !!node.g);
  ok('the armed stop knows where it is', node.i === 0 && node.trail === 'little');
  ok('the armed stop carries its label', !!node.label);

  var res = Save.completeNode();
  ok('winning a stop advances the trail', res.advanced === true);
  ok('the trail moved on', Save.mapAt('little') === 1);
  ok('nothing stays armed after completing', Save.activeNode() === null);
  ok('the beaten stop reads as done', Save.nodeState('little', 0) === 'done');
  ok('the next one opened up', Save.nodeState('little', 1) === 'next');

  /* Replaying a stop you've already beaten is allowed, but must not walk the
     trail forward twice. */
  ok('a beaten stop can be replayed', Save.startNode('little', 0) === false);
  ok('replaying is refused because it is no longer "next"',
     Save.nodeState('little', 0) === 'done');

  Save.startNode('little', 1);
  Save.completeNode();
  ok('the trail advances again', Save.mapAt('little') === 2);

  /* completing with nothing armed must be a no-op, not a crash */
  ok('completing nothing is harmless', Save.completeNode() === null);
  ok('the trail did not move', Save.mapAt('little') === 2);

  /* the two trails are independent */
  ok('the other trail is untouched', Save.mapAt('big') === 0);
  Save.startNode('big', 0);
  Save.completeNode();
  ok('each trail advances on its own',
     Save.mapAt('big') === 1 && Save.mapAt('little') === 2);

  /* clearing */
  Save.startNode('little', 2);
  ok('a stop is armed', Save.activeNode() !== null);
  Save.clearNode();
  ok('clearing disarms it', Save.activeNode() === null);
  ok('clearing did not advance the trail', Save.mapAt('little') === 2);

  /* a stop that needs a world stays shut until it is bought */
  fresh();
  // read the normalized trail, not raw MAP: a forked step is an array there,

  ok('an older save that walked the little trail reads as the little kid',

  ok('a tie falls back to the last track they chose',

  Save.update(function (p) { p.progress.map.little = 12; });
  function monthOf() {
    var days = [], seen = {}, stable = true;
    for (var dd = 1; dd <= 28; dd++) {
      var k = '2026-04-' + ('0' + dd).slice(-2);
      var got = Save.daily(k);
      if (Save.daily(k).node.label !== got.node.label) stable = false;
      days.push(got.node.label);
      seen[got.node.label] = 1;
    }
    return { days: days, distinct: Object.keys(seen).length, stable: stable };
  }

  ok('a day always gives the same challenge', mine.stable);
  // The pool is what it is, so measure against it rather than a bare number:
  // a month must reach a decent share of what's actually available.
  var poolSize = (function () {
    var seen = {}, reach = 12 + Save.ECONOMY.dailyReach;
    Save.mapTrail('little').slice(0, reach + 1).forEach(function (st) {
      st.options.forEach(function (o) {
        if (o.g !== 'story') seen[o.g + o.t + o.m] = 1;
      });
    });
    return Object.keys(seen).length;
  })();
  ok('a month is not the same challenge over and over',
     mine.distinct >= Math.min(6, Math.ceil(poolSize / 2)),
     mine.distinct + ' distinct in 28 days, from a pool of ' + poolSize);

  // "challenge" is really just a calendar everyone shares.

  for (var mi = 0; mi < mine.days.length; mi++) {

  playedOn(30, 9);
  ok('missing a month still only steps back by one', Save.touchDay() === 8);
  playedOn(9, 1);

  /* ---------- wild allies ---------- */
  fresh();
  var realRandom = Math.random;
  function withRandom(v, fn) {           // v: a number, or a queue of them
    var q = Array.isArray(v) ? v.slice() : null;
    Math.random = function () { return q ? (q.length ? q.shift() : 1) : v; };
    try { return fn(); } finally { Math.random = realRandom; }
  }

  var mob = { id: anyCard.id, name: anyCard.name, emoji: anyCard.emoji };
  var stranger = { id: Save.allCards()[1].id, name: 'Stranger', emoji: '👾' };

     withRandom(0, function () { return Save.rollAlly(null, 0); }) === null);
  ok('an unknown monster joins on a low roll',
     !!withRandom(0, function () { return Save.rollAlly(stranger, 0); }));
  ok('...and not on a high roll',

  ok('the ally carries the monster it came from',

  ok('a full party takes no one else',
     withRandom(0, function () { return Save.rollAlly(mob, Save.ECONOMY.maxAllies); }) === null);
  ok('...and the cap is the only thing stopping it',

  // this is the whole point of the feature, so pin the boundary exactly.
  var between = Save.ECONOMY.allyJoinChance + 0.01;
  ok('a stranger declines a middling roll',
     withRandom(between, function () { return Save.rollAlly(mob, 0); }) === null);
  Save.awardCard(mob.id, true);
  ok('a monster whose card you hold accepts the same roll',
     !!withRandom(between, function () { return Save.rollAlly(mob, 0); }));
  ok('...and knows that you know it',
     withRandom(0, function () { return Save.rollAlly(mob, 0).known; }) === true);

  ok('no allies means no extra damage', Save.allyStrikes([]) === 0);
  ok('an undefined party means no extra damage', Save.allyStrikes() === 0);
  ok('every ally can land a blow at once',
     withRandom(0, function () { return Save.allyStrikes([1, 2, 3]); }) === 3);
  ok('and none of them on a bad roll',
     withRandom(0.99, function () { return Save.allyStrikes([1, 2, 3]); }) === 0);
  ok('extra damage never exceeds the party size',
     withRandom([0, 0.99, 0], function () { return Save.allyStrikes([1, 2, 3]); }) === 2);

  // Three allies at the tuned rate must not trivialise a fight: the expected
  // bonus is checked against the tuning rather than a number baked in here.
  var total = 0, ROLLS = 4000;
  for (var ai = 0; ai < ROLLS; ai++) total += Save.allyStrikes([1, 2, 3]);
  var mean = total / ROLLS;
  ok('a full party adds about the damage the tuning promises',
     Math.abs(mean - 3 * Save.ECONOMY.allyStrikeChance) < 0.08, 'mean ' + mean.toFixed(3));
  ok('...which is under one point a hit, so it helps rather than wins',
     3 * Save.ECONOMY.allyStrikeChance < 1);

  /* ---------- persistence across a reload ---------- */
  fresh();
  Save.award(77, 33);
  var raw = localStorage.getItem(Save._key);
  ok('the save is actually written to localStorage', !!raw && raw.indexOf('77') !== -1);
  var reparsed = JSON.parse(raw);
  ok('the written blob holds the gold',
     reparsed.profiles[reparsed.active].gold === 77);

  /* The map is an array and saves store an index into it. Removing or
     reordering a step teleports every hero who was standing past it. So the
     first road of every step that has ever shipped is frozen here: new ground
     is appended, never inserted. Extend this list when steps are appended;
     never change a line already in it. */
  var TRAIL_PREFIX = {

      'math:place:expert', 'language:fixit:expert', 'math:alg:expert',
      'math:wordprob:expert', 'language:marks:expert', 'math:alg:expert',
      /* The Drowned Library, Thunder Plateau, The Deep Hollow. */
      'language:grammar:expert', 'language:marks:expert', 'language:fixit:expert',
      'language:twins:expert', 'language:grammar:expert', 'math:alg:expert',
      'math:rule:expert', 'math:mul:expert', 'math:wordprob:expert',
      'math:alg:expert', 'language:forge:expert', 'math:place:expert',

  function stepSig(o) {
    return [o.g,
            o.t != null ? o.t : (o.quest != null ? 'q' + o.quest : 'mini-' + o.mini),
            o.m || '-'].join(':');
  }

  /* ---------- an older save must never lose a thing ----------

     The kids play the deployed site. Every push replaces the code under a
     save that is already on their iPads, and there is no server copy to fall
     back on — a save lost is a lost month. So each shipped schema version
     keeps a fixture here, and every one of them has to still load with
     everything intact. Add a new fixture when VERSION goes up; never edit an
     old one, because the whole point is that it is what really shipped. */

  var FIXTURES = {
    2: {
      v: 2, active: 'kid',
      profiles: { kid: {
        name: 'Sam', avatar: '🦖', xp: 1240, gold: 5600, level: 5,
        inventory: { owned: ['sword', 'tunic', 'chick', 'coin'], weapon: 'sword',
                     armor: 'tunic', pet: 'chick', trinket: 'coin', tokens: 2 },
        cards: { 'm-slime': 3, 'b-meadow': 1 }, foils: { 'm-slime': 1 },
        progress: { world: 'cave', unlockedWorlds: ['meadow', 'cave'],
                    runsWon: { math: 12 }, questsDone: [0, 1], seqTier: 3,
                    koSinceCard: 11,
                    map: { little: 0, big: 5 },
                    mapPicks: { little: {}, big: { 2: 1 } },
                    mapWalk: null,
                    activeNode: { trail: 'big', i: 5, o: 0 } },
        settings: { modeByGame: { math: 'expert' }, lastTrack: { math: 'mul' } },
        stats: { correct: 900, wrong: 120, streak: 4, bestStreak: 31 }
      } }
    },
    3: {
      v: 3, active: 'kid',
      profiles: { kid: {
        name: 'Alex', avatar: '🦸', xp: 3100, gold: 21000, level: 8,
        inventory: { owned: ['blade', 'mail', 'drake', 'hourglass'], weapon: 'blade',
                     armor: 'mail', pet: 'drake', trinket: 'hourglass', tokens: 1,
                     petXp: { drake: 74 } },
        cards: { 'm-crab': 2, 'l-troll': 1 }, foils: { 'l-troll': 1 },
        progress: { world: 'sky', unlockedWorlds: ['meadow', 'cave', 'sky'],
                    runsWon: { math: 40, language: 18 }, questsDone: [0, 1, 2, 3],
                    seqTier: 4, koSinceCard: 3, skipMastered: true,
                    map: { little: 2, big: 14 },
                    mapPicks: { little: { 0: 0 }, big: { 2: 1, 7: 0, 12: 1 } },
                    mapWalk: null,
                    activeNode: { trail: 'big', i: 14, o: 0 },
                    dailyDone: '2026-08-15',
                    streak: { days: 5, last: '2026-08-16' } },
        settings: { modeByGame: { math: 'expert' }, lastTrack: { math: 'alg' } },
        stats: { correct: 3400, wrong: 410, streak: 9, bestStreak: 52 }
      } }
    },
    /* A v4 hero, caught mid-journey: two trails part-walked, a boss stop
       half-played on the big trail, a set nearly finished, and a row they
       said out loud rather than one guessed for them. This is the shape that
       was on the iPads the day the dungeon landed. */
    4: {
      v: 4, active: 'kid',
      profiles: { kid: {
        name: 'Rowan', avatar: '🦊', xp: 9200, gold: 48000, level: 14, row: 'big',
        inventory: { owned: ['frost', 'scale', 'griffin', 'clover', 'ipad'],
                     weapon: 'frost', armor: 'scale', pet: 'griffin',
                     trinket: 'clover', tokens: 3,
                     petXp: { griffin: 210, drake: 88 } },
        cards: { 'm-slime': 4, 'm-bat': 2, 'm-ghost': 1, 'm-dragon': 1,
                 'l-slime': 3, 'l-imp': 1, 'l-ghost': 2, 'l-rex': 1,
                 'm-crab': 2, 'l-troll': 1, 's-troll': 1, 's-dragon': 1 },
        foils: { 'm-dragon': 1, 's-troll': 1 },
        progress: { world: 'reef',
                    unlockedWorlds: ['meadow', 'cave', 'sky', 'reef'],
                    runsWon: { math: 96, language: 51 },
                    questsDone: [0, 1, 2, 3, 4],
                    seqTier: 5, koSinceCard: 17, skipMastered: true,
                    map: { little: 9, big: 21 },
                    mapPicks: { little: { 2: 1, 5: 0, 7: 1 },
                                big: { 2: 0, 7: 1, 10: 0, 14: 1, 18: 0 } },
                    mapWalk: null,
                    activeNode: { trail: 'big', i: 21, o: 0 },
                    dailyDone: '2026-08-18',
                    streak: { days: 11, last: '2026-08-18' } },
        settings: { modeByGame: { math: 'expert', language: 'normal' },
                    lastTrack: { math: 'rule', language: 'twins' } },
        stats: { correct: 9100, wrong: 980, streak: 22, bestStreak: 88 }
      } }
    },

    /* A v5 hero: the shape that was on the iPads the day the Robot Workshop
       landed. Round 5 is all over this one — the far trail part-walked, a
       dungeon record set, gear that only drops underground both equipped and
       forged, and a helm and boots in the two slots v5 added. Unlike the
       older fixtures this hero HAS been down a staircase, which is exactly
       what makes it worth freezing: the v5 block's fields have real values in
       them here, and a later migration that "tidies" one would wipe a record
       rather than fill in a blank. */
    5: {
      v: 5, active: 'kid',
      profiles: { kid: {
        name: 'Wren', avatar: '🦖', xp: 26400, gold: 133500, level: 24, row: 'little',
        inventory: { owned: ['flame', 'plate', 'drake', 'hourglass', 'ironhelm',
                             'hideboots', 'ipad'],
                     weapon: 'f-gloom', armor: 'plate', pet: 'drake',
                     trinket: 'hourglass', helm: 'ironhelm', boots: 'f-treads',
                     tokens: 4,

                     found: { 'f-gloom': 3, 'f-treads': 2, 'f-lantern': 1 },
                     forge: { 'f-gloom': 2, ironhelm: 1 } },
        cards: { 'm-slime': 6, 'm-bat': 3, 'm-ghost': 2, 'm-dragon': 1,
                 'l-slime': 4, 'l-imp': 2, 'l-ghost': 3, 'l-rex': 1, 'l-dragon': 1,
                 'm-crab': 3, 'm-spider': 1, 'l-troll': 2,
                 'm-sprout': 2, 'l-whisper': 1, 'b-meadow': 1, 'b-cave': 1,
                 's-troll': 1, 's-dragon': 1, 's-order': 2 },
        foils: { 'm-dragon': 1, 'l-dragon': 1, 's-order': 1 },
        progress: { world: 'ember',
                    unlockedWorlds: ['meadow', 'cave', 'sky', 'reef', 'ember'],
                    runsWon: { math: 210, language: 137 },
                    questsDone: [0, 1, 2, 3, 4, 5, 6],
                    seqTier: 5, koSinceCard: 8, skipMastered: true,
                    map: { little: 34, big: 12 },
                    mapPicks: { little: { 2: 1, 5: 0, 7: 1, 10: 0, 13: 1,
                                          16: 0, 21: 1, 26: 0, 31: 1 },
                                big: { 2: 0, 5: 1, 10: 0 } },
                    mapWalk: null,
                    activeNode: { trail: 'little', i: 34, o: 0 },
                    dungeon: null,
                    dungeonBest: 9,
                    dailyDone: '2026-08-19',
                    streak: { days: 26, last: '2026-08-19' } },
        settings: { modeByGame: { math: 'normal', language: 'easy' },
                    lastTrack: { math: 'skip', language: 'rhyme' } },
        stats: { correct: 24800, wrong: 2600, streak: 15, bestStreak: 104 }
      } }
    }
  };

  Object.keys(FIXTURES).forEach(function (ver) {
    var fx = FIXTURES[ver];
    var was = JSON.parse(JSON.stringify(fx.profiles.kid));
    localStorage.setItem(Save._key, JSON.stringify(fx));
    Save._reload();
    var p = Save.me();
    var tag = 'v' + ver + ' save: ';

    ok(tag + 'the hero is still there', !!p && p.name === was.name);
    ok(tag + 'the gold is untouched', p.gold === was.gold, p && p.gold);
    ok(tag + 'the XP is untouched', p.xp === was.xp);
    ok(tag + 'the gear is still equipped',
       p.inventory.weapon === was.inventory.weapon &&
       p.inventory.armor === was.inventory.armor &&
       p.inventory.pet === was.inventory.pet &&
       p.inventory.trinket === was.inventory.trinket);
    ok(tag + 'everything bought is still owned',
       was.inventory.owned.every(function (id) { return Save.owns(id); }));
    ok(tag + 'the iPad-time tokens survived',
       p.inventory.tokens === was.inventory.tokens);
    ok(tag + 'the cards survived, counts and all',
       JSON.stringify(p.cards) === JSON.stringify(was.cards));
    ok(tag + 'the foils survived', JSON.stringify(p.foils) === JSON.stringify(was.foils));
    ok(tag + 'the unlocked worlds survived',
       p.progress.unlockedWorlds.join() === was.progress.unlockedWorlds.join());
    ok(tag + 'the map position is exactly where they left it',
       p.progress.map.big === was.progress.map.big &&
       p.progress.map.little === was.progress.map.little);
    ok(tag + 'the roads already taken are still remembered',
       JSON.stringify(p.progress.mapPicks) === JSON.stringify(was.progress.mapPicks));
    ok(tag + 'the quests done survived',
       p.progress.questsDone.join() === was.progress.questsDone.join());
    ok(tag + 'the lifetime stats survived',
       p.stats.correct === was.stats.correct && p.stats.bestStreak === was.stats.bestStreak);
    ok(tag + 'the pity counter survived', p.progress.koSinceCard === was.progress.koSinceCard);
    ok(tag + 'the remembered track and mode survived',
       p.settings.lastTrack.math === was.settings.lastTrack.math &&
       p.settings.modeByGame.math === was.settings.modeByGame.math);

    // A stop half-played when the deploy landed must still resume, and must
    // resume into the road that was there — this is what broke when bosses
    // became forks, if option 0 hadn't been kept as the original.
    var live = Save.activeNode();
    var wanted = TRAIL_PREFIX[was.progress.activeNode.trail][was.progress.activeNode.i];
    ok(tag + 'a stop left half-played still resumes', !!live);
    ok(tag + 'it resumes into the road that was there',
       live && stepSig(live) === wanted,
       live && stepSig(live) + ' vs ' + wanted);

    // v4 gave heroes a row. An older save has to come out of the migration
    // with one, read off the road behind them.
    ok(tag + 'the hero comes out knowing which kid they are',
       Save.rowOf() === 'little' || Save.rowOf() === 'big');
    ok(tag + 'and it matches the trail they had been walking',
       Save.rowOf() === (was.progress.map.big > was.progress.map.little
                         ? 'big' : 'little'),
       Save.rowOf() + ' with map ' + JSON.stringify(was.progress.map));

    /* v5 opened the dungeon and the forge. These used to assert the fields
       arrived EMPTY, which was true of every fixture back then because none of
       them predated the dungeon by less than a version. A real v5 save has
       been underground, so the honest assertion is the general one: whatever
       was there is still there, and whatever wasn't arrives as the empty
       default. That covers both eras, and it is strictly the stronger claim —
       a migration that reset `dungeonBest` to 0 now wipes a record instead of
       quietly agreeing with a test that expected a blank. */
    var wantDungeon = was.progress.dungeon === undefined ? null : was.progress.dungeon;
    ok(tag + 'the dungeon in progress is exactly as it was',
       JSON.stringify(p.progress.dungeon) === JSON.stringify(wantDungeon),
       JSON.stringify(p.progress.dungeon));
    ok(tag + 'the deepest floor is neither invented nor forgotten',
       p.progress.dungeonBest === (was.progress.dungeonBest || 0),
       'best ' + p.progress.dungeonBest +
       ' vs ' + (was.progress.dungeonBest || 0));
    ok(tag + 'found gear survived, star rolls and all',
       JSON.stringify(p.inventory.found) ===
       JSON.stringify(was.inventory.found || {}),
       JSON.stringify(p.inventory.found));
    ok(tag + 'the forge levels survived',
       JSON.stringify(p.inventory.forge) ===
       JSON.stringify(was.inventory.forge || {}),
       JSON.stringify(p.inventory.forge));

    /* v6 makes room for the Robot Workshop. Nothing that has ever shipped had
       a robot to remember, so every fixture must come out with the fields
       present and empty — a pack marked finished would pay a card for work
       nobody did. */
    var rb = p.progress.robot;
    ok(tag + 'the robot fields arrived', !!rb && !!rb.solved && !!rb.par && !!rb.packs,
       JSON.stringify(rb));
    ok(tag + 'no robot level is invented as solved',
       rb && Object.keys(rb.solved).length === 0 && Object.keys(rb.par).length === 0,
       JSON.stringify(rb && rb.solved));
    ok(tag + 'no robot pack arrives pre-finished',
       rb && rb.packs.length === 0, JSON.stringify(rb && rb.packs));

    ok(tag + 'it is stamped with the current schema afterwards',
       JSON.parse(localStorage.getItem(Save._key)).v === Save._version);
    // migrating twice must not double anything (a reload is not a migration)
    var afterOnce = localStorage.getItem(Save._key);
    Save._reload();
    ok(tag + 'loading it again changes nothing',
       localStorage.getItem(Save._key) === afterOnce);
  });

  Object.keys(TRAIL_PREFIX).forEach(function (tr) {
    var want = TRAIL_PREFIX[tr];
    var steps = Save.mapTrail(tr);
    ok(tr + ' trail: it only ever got longer', steps.length >= want.length,
       steps.length + ' vs ' + want.length);
    var drift = [];
    want.forEach(function (sig, i) {
      if (!steps[i] || stepSig(steps[i].options[0]) !== sig) {
        drift.push(i + ': ' + sig + ' -> ' +
                   (steps[i] ? stepSig(steps[i].options[0]) : 'gone'));
      }
    });
    ok(tr + ' trail: no shipped stop moved or changed', drift.length === 0,
       drift.join('; '));
  });

  // Every region's chests must have monsters to draw from. A region with no
  // card pool makes a boss chest promise a card and hand over nothing — which
  // is exactly what happened the first time regions and worlds drifted apart.
  Save.REGIONS.forEach(function (rg) {
    ok('region "' + rg.id + '" has cards for its chests',
       Save.cardsOfWorld(rg.cards || rg.id).length > 0);
  });

  /* Having *a* pool isn't enough. Market Town and The Observatory shipped
     as regions that borrowed the Reef's and the Peak's monsters through the
     `cards` fallback, so their boss chests promised a card and handed over
     one the hero had almost certainly already held for weeks. A region whose
     id is a world in its own right must draw its own. */
  Save.REGIONS.forEach(function (rg) {
    if (!Save.world(rg.id)) return;   // a region that isn't a world may borrow
    ok('region "' + rg.id + '" draws its own monsters, not a loan',
       !rg.cards, 'borrows ' + rg.cards);
  });

  /* ---------- a map stop fights what lives there ----------
     This used to read progress.world whatever you were doing, so the map's
     places were scenery: Ember Peak full of Meadow slimes if the Meadow was
     all you owned. Free play still uses the world you chose — that's the
     whole point of buying one. */
  fresh();
  Save.createProfile('Wanderer', '🧭');
  Save.update(function (p) { p.progress.world = 'meadow'; });

  ok('free play fights the world you chose',
     Save.foesFor('math')[0].id === Save.world('meadow').foes.math[0].id);

  // find a stop deep enough to be in a different region than the Meadow
  var farRegion = null, farStep = -1;
  Save.mapTrail('little').forEach(function (st) {
    if (farStep === -1 && st.region.id !== 'meadow' && !st.boss) {
      farRegion = st.region; farStep = st.i;
    }
  });
  ok('the little trail leaves the meadow', farStep > -1);

  Save.update(function (p) {
    p.progress.activeNode = { trail: 'little', i: farStep, o: 0 };
  });
  var localFoes = Save.foesFor('math');
  ok('a map stop fights its own region, not your bought world',
     localFoes[0].id === Save.world(farRegion.cards || farRegion.id).foes.math[0].id,
     'at ' + farRegion.id + ' got ' + localFoes[0].id);
  ok('...and those are not the monsters free play would have given',
     localFoes[0].id !== Save.world('meadow').foes.math[0].id);

  Save.clearNode();
  ok('leaving the map goes back to the world you chose',
     Save.foesFor('math')[0].id === Save.world('meadow').foes.math[0].id);
  ['little', 'big'].forEach(function (tr) {
    Save.mapTrail(tr).forEach(function (step) {
      if (!step.boss) return;
      ok('boss at ' + tr + ' ' + step.i + ' can actually pay its card',
         Save.cardsOfWorld(step.region.cards || step.region.id).length > 0);
    });
  });

  // The rule that makes the above possible: every boss fork's first road is
  // the stop as it was before bosses forked, so an activeNode saved with o: 0
  // still points at the same game, track and mode.
  ['little', 'big'].forEach(function (tr) {
    Save.mapTrail(tr).forEach(function (step) {
      if (!step.boss) return;
      ok('boss forks keep the original road first (' + tr + ' ' + step.i + ')',
         step.options[0].weak === true);
    });
  });

  /* ---------- gear you find, and the forge ---------- */
  fresh();
  Save.createProfile('Smith', '🔨');
  Save.update(function (p) { p.gold = 200000; });

  ok('found gear is not for sale at any price', Save.buy('f-gloom') === 'notforsale');
  ok('...and asking does not quietly hand it over', !Save.owns('f-gloom'));

  var drop = Save.awardFound('f-gloom', 2);
  ok('a drop grants the item', Save.owns('f-gloom') && drop.better);
  ok('...with the stars it rolled', Save.starsOf('f-gloom') === 2);
  var worse = Save.awardFound('f-gloom', 1);
  ok('a worse roll never downgrades what you hold', Save.starsOf('f-gloom') === 2,
     'stars now ' + Save.starsOf('f-gloom'));
  ok('...and says so rather than pretending', worse.better === false);
  Save.awardFound('f-gloom', 3);
  ok('a better roll does replace it', Save.starsOf('f-gloom') === 3);

  // stars scale what the thing does
  Save.equip('f-gloom');
  ok('found gear can be worn', Save.me().inventory.weapon === 'f-gloom');
  var threeStar = Save.loadout().crit;
  ok('three stars is worth more than the plain item',
     threeStar > Save.item('f-gloom').crit,
     Save.item('f-gloom').crit + ' -> ' + threeStar);

  // the forge
  var cost = Save.forgeCost('f-gloom');
  var goldBefore = Save.me().gold;
  ok('the forge quotes a price', cost > 0);
  ok('forging works', Save.forgeUp('f-gloom') === 'ok');
  ok('...and charges for it', Save.me().gold === goldBefore - cost,
     goldBefore + ' -> ' + Save.me().gold);
  ok('...and the level went up', Save.forgeLevel('f-gloom') === 1);
  ok('a forged item is worth more than it was',
     Save.loadout().crit > threeStar,
     threeStar + ' -> ' + Save.loadout().crit);
  ok('each level costs more than the last', Save.forgeCost('f-gloom') > cost,
     cost + ' then ' + Save.forgeCost('f-gloom'));

  // it caps, and it says so rather than silently taking the gold
  var guard = 0;
  while (Save.forgeUp('f-gloom') === 'ok' && guard++ < 20) { /* keep going */ }
  ok('the forge has a ceiling', Save.forgeLevel('f-gloom') === Save.forgeMax,
     'level ' + Save.forgeLevel('f-gloom'));
  ok('...and refuses politely at the top', Save.forgeUp('f-gloom') === 'max');
  ok('...and asks nothing more for it', Save.forgeCost('f-gloom') === null);

  var pooredGold = Save.me().gold;
  Save.buy('sword');
  Save.update(function (p) { p.gold = 5; });
  ok('you cannot forge what you cannot afford', Save.forgeUp('sword') === 'broke');
  ok('...and it costs nothing to be told so', Save.me().gold === 5);
  ok('and forging what you do not own is refused', Save.forgeUp('aegis') === 'nosuch');
  Save.update(function (p) { p.gold = pooredGold; });

  /* Work done on a piece belongs to the piece, not the slot — putting it away
     and bringing it back must not undo it, for the same reason a pet keeps
     what it grew. */
  Save.buy('axe');
  Save.equip('axe');
  ok('swapping weapons does not undo the forge',
     Save.forgeLevel('f-gloom') === Save.forgeMax);
  Save.equip('f-gloom');
  ok('...and it is still there when it comes back out',
     Save.loadout().crit > threeStar);

  /* The pet rule, applied to gear: a cheap piece forged to the hilt must not
     beat a plain dearer one on every count at once, or the ladder stops
     meaning anything and the forge becomes the only thing worth doing. */
  Save.update(function (p) { p.gold = 900000; });
  Save.buy('frost');
  var g2 = 0;
  Save.equip('sword');
  while (Save.forgeUp('sword') === 'ok' && g2++ < 20) { /* max the cheap one */ }
  var maxedSword = Save.loadout();
  Save.equip('frost');
  var plainFrost = Save.loadout();
  ok('the cheap weapon really was forged to the top',
     Save.forgeLevel('sword') === Save.forgeMax);

  /* The ladder property, stated properly. Forging must never let a tier
     overtake the tier above it — otherwise the shop stops being a ladder and
     the forge becomes the only thing worth spending on. Checked across every
     rung of the weapon ladder rather than one hand-picked pair, because a
     single comparison can pass while the tuning is wildly wrong: at seven
     times the intended step this said nothing at all, since the cheap sword
     still lacked the dearer one's DOUBLE damage. */
  /* Compare the whole weapon, not its crit. The shop ladder does not climb on
     crit alone — the Flame Blade beats the Axe on DOUBLE damage while barely
     moving crit at all — so a crit-only comparison reports the ladder itself
     as broken. A point of DOUBLE damage is worth far more than a percentage
     of crit, hence the weighting. */
  function power(l) { return l.crit + (l.superDamage - 2) * 0.5; }
  var ladder = Save.SHOP.filter(function (i) { return i.kind === 'weapon' && i.crit; });
  var overtakes = [];
  ladder.forEach(function (lower, li) {
    var upper = ladder[li + 1];
    if (!upper) return;
    Save.update(function (p) {
      p.inventory.owned.push(lower.id, upper.id);
      p.inventory.forge[lower.id] = Save.forgeMax;
      p.inventory.forge[upper.id] = 0;
      p.inventory.weapon = lower.id;
    });
    var forged = power(Save.loadout());
    Save.update(function (p) { p.inventory.weapon = upper.id; });
    var plain = power(Save.loadout());
    if (forged >= plain) {
      overtakes.push(lower.id + '+' + Save.forgeMax + ' ' + forged.toFixed(3) +
                     ' >= plain ' + upper.id + ' ' + plain.toFixed(3));
    }
  });
  ok('forging never lets a tier overtake the one above it',
     overtakes.length === 0, overtakes.slice(0, 3).join('; '));

  /* ---------- the dungeon ----------

     A floor is generated, not authored, so it cannot be reviewed by reading
     it. The only honest way to check generated content is to generate a great
     deal of it and assert the things that must hold every single time. */

  var floorsChecked = 0, noStairs = [], noFight = [], badType = [], earlyElite = [];
  var tooManyPuzzles = [], puzzleFloors = 0;
  var KNOWN = ['entrance', 'stairs', 'monster', 'elite', 'shrine', 'treasure',
               'puzzle', 'empty'];
  ['little', 'big'].forEach(function (row) {
    for (var seed = 1; seed <= 400; seed++) {
      for (var fl = 1; fl <= 12; fl++) {
        var rooms = Save.dungeonFloor(seed * 7919, fl, row);
        floorsChecked++;
        var stairs = 0, fights = 0, puzzles = 0;
        rooms.forEach(function (r) {
          if (r.t === 'stairs') stairs++;
          if (r.t === 'monster' || r.t === 'elite') fights++;
          if (r.t === 'puzzle') puzzles++;
          if (KNOWN.indexOf(r.t) === -1) badType.push(row + ' ' + seed + '/' + fl + ': ' + r.t);
          if (r.t === 'elite' && fl < Save.ECONOMY.dungeon.eliteFrom) {
            earlyElite.push(row + ' floor ' + fl);
          }
        });
        if (stairs !== 1) noStairs.push(row + ' ' + seed + '/' + fl + ': ' + stairs);
        if (fights < 1) noFight.push(row + ' ' + seed + '/' + fl);
        if (puzzles > 1) tooManyPuzzles.push(row + ' ' + seed + '/' + fl + ': ' + puzzles);
        if (puzzles) puzzleFloors++;
        if (rooms[0].t !== 'entrance') badType.push(row + ' ' + seed + '/' + fl + ': no entrance');
      }
    }
  });
  ok('dungeon: a lot of floors were generated to check', floorsChecked === 9600,
     floorsChecked + ' floors');
  ok('dungeon: every floor has exactly one staircase', noStairs.length === 0,
     noStairs.slice(0, 3).join('; '));
  ok('dungeon: every floor has something to fight', noFight.length === 0,
     noFight.slice(0, 3).join('; '));
  ok('dungeon: no room is of a type nothing can draw', badType.length === 0,
     badType.slice(0, 3).join('; '));
  ok('dungeon: elites keep away from the shallow floors', earlyElite.length === 0,
     earlyElite.slice(0, 3).join('; '));
  /* The puzzle room is dealt from the same leftover pool the chests come from,
     so more than one on a floor would be quietly eating the treasure. And a
     room type that almost never appears is a room type nobody has tested. */
  ok('dungeon: never more than one stuck robot on a floor',
     tooManyPuzzles.length === 0, tooManyPuzzles.slice(0, 3).join('; '));
  ok('dungeon: a stuck robot turns up on most floors, not all',
     puzzleFloors > floorsChecked * 0.5 && puzzleFloors < floorsChecked,
     puzzleFloors + ' of ' + floorsChecked + ' floors');

  /* Every room must be walkable to from the entrance. The grid has no walls
     precisely so this can never fail — but "can never fail" is exactly the
     kind of claim that stops being true when somebody adds walls later. */
  var stranded = [];
  ['little', 'big'].forEach(function (row) {
    var side = Save.dungeonSide(row);
    var rooms = Save.dungeonFloor(999, 5, row);
    var seen = {}, queue = [0];
    seen[0] = true;
    while (queue.length) {
      var at = queue.shift();
      Save.dungeonNeighbours(at, row).forEach(function (nb) {
        if (!seen[nb]) { seen[nb] = true; queue.push(nb); }
      });
    }
    for (var i = 0; i < rooms.length; i++) if (!seen[i]) stranded.push(row + ' room ' + i);
    ok('dungeon: the ' + row + ' grid is ' + side + 'x' + side,
       rooms.length === side * side);
  });
  ok('dungeon: no room can be walled off from the entrance', stranded.length === 0,
     stranded.slice(0, 4).join('; '));

  // the same seed must draw the same floor, or a reload rebuilds the world
  var a1 = Save.dungeonFloor(4242, 3, 'big').map(function (r) { return r.t; }).join(',');
  var a2 = Save.dungeonFloor(4242, 3, 'big').map(function (r) { return r.t; }).join(',');
  var a3 = Save.dungeonFloor(4243, 3, 'big').map(function (r) { return r.t; }).join(',');
  ok('dungeon: the same seed draws the same floor', a1 === a2);
  ok('dungeon: a different seed draws a different one', a1 !== a3);

  // deeper floors really are more of a fight
  function fightShare(fl) {
    var n = 0, tot = 0;
    for (var seed = 1; seed <= 120; seed++) {
      var rooms = Save.dungeonFloor(seed * 31, fl, 'big');
      rooms.forEach(function (r) {
        tot++;
        if (r.t === 'monster' || r.t === 'elite') n++;
      });
    }
    return n / tot;
  }
  var shallow = fightShare(1), deep = fightShare(12);
  ok('dungeon: it gets harder the further down you go', deep > shallow + 0.1,
     'floor 1 ' + shallow.toFixed(2) + ' vs floor 12 ' + deep.toFixed(2));

  /* Which kid is playing has to reach all the way down here too. The dungeon
     draws its fights from the hero's OWN trail, so a five-year-old must never
     be handed algebra in a monster room — the same failure the map had when
     heroTrail() was inferred rather than stored. Checked by holding every
     fight the floor can offer against that row's trail. */
  ['little', 'big'].forEach(function (row) {
    fresh();
    Save.createProfile('Row ' + row, '🧭');
    Save.update(function (p) { p.row = row; });

    var mine = {}, theirs = {};
    Save.mapTrail(row).forEach(function (st) {
      st.options.forEach(function (o) { if (o.t) mine[o.g + ':' + o.t] = true; });
    });
    Save.mapTrail(row === 'little' ? 'big' : 'little').forEach(function (st) {
      st.options.forEach(function (o) { if (o.t) theirs[o.g + ':' + o.t] = true; });
    });

    var run = Save.dungeonStart();
    var leaked = [], seen = 0;
    for (var floor = 1; floor <= 10; floor++) {
      for (var i = 0; i < run.rooms.length; i++) {
        Save.update(function (p) {
          p.progress.dungeon.floor = floor;
          p.progress.dungeon.pos = i;
          p.progress.dungeon.rooms[i] = { t: 'monster', done: false };
        });
        var f = Save.dungeonFight();
        if (!f) continue;
        seen++;
        var key = f.g + ':' + f.t;
        if (!mine[key]) leaked.push('floor ' + floor + ': ' + key);
      }
    }
    ok('dungeon: the ' + row + ' hero was offered plenty of fights', seen > 50,
       seen + ' fights');
    ok('dungeon: a ' + row + ' hero only ever meets their own trail\'s work',
       leaked.length === 0, leaked.slice(0, 3).join('; '));
    ok('dungeon: the two trails really are different work',
       Object.keys(mine).some(function (k) { return !theirs[k]; }));
    ok('dungeon: the ' + row + ' grid is the size that row uses',
       run.rooms.length ===
         Save.dungeonSide(row) * Save.dungeonSide(row));
  });

  /* ---------- a descent, played ---------- */
  fresh();
  Save.createProfile('Delver', '🦎');
  Save.update(function (p) { p.row = 'little'; });
  var run = Save.dungeonStart();
  ok('dungeon: a run starts on floor one', run && run.floor === 1);
  ok('dungeon: it starts at the entrance', run.pos === 0);
  ok('dungeon: the run is remembered on the profile', !!Save.dungeonRun());

  var nbs = Save.dungeonNeighbours(0, 'little');
  ok('dungeon: the entrance has somewhere to go', nbs.length >= 2);
  ok('dungeon: you cannot step to a room that is not next to you',
     Save.dungeonMove(15) === null);
  ok('dungeon: you can step to one that is', !!Save.dungeonMove(nbs[0]));
  ok('dungeon: and you are now standing there', Save.dungeonRun().pos === nbs[0]);

  // an unfought monster holds you in place
  Save.update(function (p) {
    p.progress.dungeon.rooms[p.progress.dungeon.pos] = { t: 'monster', done: false };
  });
  var held = Save.dungeonRun().pos;
  ok('dungeon: an unbeaten monster keeps you in the room',
     Save.dungeonMove(Save.dungeonNeighbours(held, 'little')[0]) === null);
  Save.update(function (p) { p.progress.dungeon.rooms[held].done = true; });
  ok('dungeon: beating it lets you move on',
     !!Save.dungeonMove(Save.dungeonNeighbours(held, 'little')[0]));

  // a blessing is felt by the games, and only while you are down there
  var beforeBless = Save.loadout().maxHp;
  Save.update(function (p) {
    p.progress.dungeon.rooms[p.progress.dungeon.pos] = { t: 'shrine', done: false };
  });
  var offer = Save.dungeonOffer(Save.dungeonRun());
  ok('dungeon: a shrine offers three blessings',
     offer.length === Save.ECONOMY.dungeon.blessings, offer.length + ' offered');
  ok('dungeon: it offers three different ones',
     offer[0].id !== offer[1].id && offer[1].id !== offer[2].id);
  ok('dungeon: taking one works', Save.dungeonBless('hearts'));
  ok('dungeon: a blessing reaches the loadout the games read',
     Save.loadout().maxHp === beforeBless + Save.BLESSINGS.filter(
       function (b) { return b.id === 'hearts'; })[0].maxHp,
     beforeBless + ' -> ' + Save.loadout().maxHp);

  // going down
  Save.update(function (p) {
    p.progress.dungeon.rooms[p.progress.dungeon.pos] = { t: 'stairs', done: false };
  });
  var floor2 = Save.dungeonDescend();
  ok('dungeon: the stairs go down', floor2.floor === 2);
  ok('dungeon: a new floor puts you back at its entrance', floor2.pos === 0);
  ok('dungeon: the deepest floor is remembered', Save.me().progress.dungeonBest === 2);

  /* The rule that matters most down here. Losing must cost nothing that was
     already found — not gold, not cards, not gear. It ends the descent, and
     that is the whole of the punishment. */
  Save.award(500, 0);
  var goldBefore = Save.me().gold;
  var cardsBefore = JSON.stringify(Save.me().cards);
  var out = Save.dungeonEnd('lost');
  ok('dungeon: falling over ends the run', Save.dungeonRun() === null);
  ok('dungeon: ...and costs not one coin', Save.me().gold === goldBefore,
     goldBefore + ' -> ' + Save.me().gold);
  ok('dungeon: ...nor a single card', JSON.stringify(Save.me().cards) === cardsBefore);
  ok('dungeon: ...and the depth still counts', Save.me().progress.dungeonBest === 2);
  ok('dungeon: it says how deep you got', out.floor === 2 && out.reason === 'lost');
  ok('dungeon: the blessing does not follow you out',
     Save.loadout().maxHp === beforeBless, 'still ' + Save.loadout().maxHp);

  fresh();

  /* ---------- corrupt storage ---------- */
  localStorage.setItem(Save._key, 'this is not json{{{');
  var recovered = JSON.parse(JSON.stringify(
    (function () { Save.reset(); return { p: Save.profiles().length }; })()));
  ok('a corrupt save recovers instead of throwing', recovered.p === 0);

  /* ---------- storage disabled ---------- */
  var realSet = localStorage.setItem;
  localStorage.setItem = function () { throw new Error('QuotaExceededError'); };
  var threw = false;
  try {
    Save.reset();
    Save.createProfile('NoStorage', '🤖');
    Save.award(5, 5);
    Save.buy('sword');
  } catch (e) {
    threw = true;
  }
  localStorage.setItem = realSet;
  ok('a full or disabled localStorage never throws', !threw);

  /* ---------- import ---------- */
  Save.reset();
  var payload = JSON.stringify({
    v: 1, active: 'x',
    profiles: { x: { name: 'Restored', avatar: '🐙', xp: 300, gold: 42,
      inventory: { owned: ['stick'], weapon: 'stick', armor: 'tunic', pet: null, tokens: 0 },
      cards: {}, progress: { world: 'meadow', unlockedWorlds: ['meadow'], runsWon: {}, questsDone: [], seqTier: 1 },
      settings: { modeByGame: {}, lastTrack: {} },
      stats: { correct: 0, wrong: 0, streak: 0, bestStreak: 0 } } }
  });
  Save.importFile(new File([payload], 'p.json', { type: 'application/json' }), function (good, msg) {
    ok('importing a good file succeeds', good === true, msg);
    ok('the imported hero is active', Save.me() && Save.me().name === 'Restored');
    ok('the imported gold came through', Save.me().gold === 42);

    Save.importFile(new File(['not json at all'], 'bad.json'), function (good2, msg2) {
      ok('importing junk is rejected', good2 === false);
      ok('the rejection explains itself', /progress file/.test(msg2), msg2);

      Save.importFile(new File(['{"hello":"world"}'], 'wrong.json'), function (good3, msg3) {
        ok('importing valid JSON with no profiles is rejected', good3 === false);
        ok('that rejection explains itself too', /hero/.test(msg3), msg3);
        finish();
      });
    });
  });
} catch (e) {
  ok('tests ran without throwing', false, e && e.message);
  finish();
}

function finish() {
  try {
    if (stash === null) localStorage.removeItem(Save._key);
    else localStorage.setItem(Save._key, stash);
  } catch (e) { /* nothing to restore into */ }
  var s = document.getElementById('summary');
  s.className = fail ? 'fail' : 'pass';
  s.textContent = fail ? (fail + ' FAILED, ' + pass + ' passed')
                       : ('All ' + pass + ' checks passed.');
  window.RESULT = { pass: pass, fail: fail };
}
</script>
</body>
</html>
