<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>save.js tests</title>
<style>
  body { font-family: ui-monospace, Menlo, Consolas, monospace; background: #12091f; color: #eee;
         padding: 24px; line-height: 1.6; }
  .pass { color: #5ce8a0; }
  .fail { color: #ff5e7e; font-weight: bold; }
  h1 { font-size: 20px; }
  #summary { margin-top: 18px; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>
<h1>shared/save.js</h1>
<div id="out"></div>
<div id="summary"></div>

<script src="../shared/save.js"></script>
<script>
/* Assertions over the save layer. Open this file in a browser, or drive it
   headlessly and read window.RESULT / #summary. It clobbers the real save, so
   it stashes and restores whatever was there. */
'use strict';

var stash = localStorage.getItem(Save._key);
var pass = 0, fail = 0;

function ok(label, cond, detail) {
  var d = document.createElement('div');
  d.className = cond ? 'pass' : 'fail';
  d.textContent = (cond ? 'PASS  ' : 'FAIL  ') + label + (cond || !detail ? '' : '   -- ' + detail);
  document.getElementById('out').appendChild(d);
  cond ? pass++ : fail++;
}

function fresh() {
  Save.reset();
  return Save.createProfile('Tester', '🦖');
}

try {
  /* ---------- profiles ---------- */
  Save.reset();
  ok('no active profile on a blank save', Save.me() === null);
  ok('blank save lists no profiles', Save.profiles().length === 0);

  var a = Save.createProfile('Alpha', '🦊');
  ok('creating a profile makes it active', Save.me() !== null && Save.me().name === 'Alpha');
  var b = Save.createProfile('Beta', '🐯');
  ok('second profile becomes active', Save.me().name === 'Beta');
  ok('both profiles are listed', Save.profiles().length === 2);

  Save.setActive(a);
  ok('switching back to the first profile works', Save.me().name === 'Alpha');
  ok('switching to a bogus id is refused', Save.setActive('nope') === false);

  Save.renameProfile(a, 'Alpha2', '🐸');
  ok('renaming works', Save.me().name === 'Alpha2' && Save.me().avatar === '🐸');

  Save.deleteProfile(b);
  ok('deleting a profile removes it', Save.profiles().length === 1);

  /* Profiles must not share state — the whole point of per-kid saves. */
  fresh();
  var p1 = Save.createProfile('Kid1', '🦸');
  Save.award(50, 50);
  var p2 = Save.createProfile('Kid2', '🦹');
  ok("a new profile starts at zero gold", Save.me().gold === 0);
  Save.setActive(p1);
  ok("the other profile kept its gold", Save.me().gold === 50);

  /* ---------- levels ---------- */
  fresh();
  ok('a new hero is level 1 with 0 xp', Save.levelOf(Save.me()).level === 1);
  ok('level 1 needs 100 xp', Save.levelOf(Save.me()).need === 100);

  var r = Save.award(0, 99);
  ok('99 xp is still level 1', Save.levelOf(Save.me()).level === 1);
  ok('no level-up reported below the threshold', r.leveledTo === null);

  r = Save.award(0, 1);
  ok('100 xp reaches level 2', Save.levelOf(Save.me()).level === 2);
  ok('the level-up is reported', r.leveledTo === 2);
  ok('level 2 costs more than level 1', Save.levelOf(Save.me()).need === 150);
  ok('progress into the level resets', Save.levelOf(Save.me()).into === 0);

  Save.award(0, 149);
  ok('249 xp is still level 2', Save.levelOf(Save.me()).level === 2);
  Save.award(0, 1);
  ok('250 xp reaches level 3', Save.levelOf(Save.me()).level === 3);

  /* A single huge award must skip through the levels correctly. */
  fresh();
  r = Save.award(0, 100 + 150 + 200);
  ok('one big award lands on the right level', Save.levelOf(Save.me()).level === 4, 'got ' + Save.levelOf(Save.me()).level);
  ok('the multi-level jump is reported', r.leveledTo === 4);

  /* ---------- earning ---------- */
  fresh();
  Save.awardEvent('correct');
  ok('a correct answer pays the table rate',
     Save.me().gold === Save.ECONOMY.correct.gold && Save.me().xp === Save.ECONOMY.correct.xp);
  Save.awardEvent('nosuchevent');
  ok('an unknown event pays nothing', Save.me().gold === Save.ECONOMY.correct.gold);

  fresh();
  Save.recordAnswer(true); Save.recordAnswer(true); Save.recordAnswer(false);
  ok('correct answers are counted', Save.me().stats.correct === 2);
  ok('wrong answers are counted', Save.me().stats.wrong === 1);
  ok('a wrong answer breaks the streak', Save.me().stats.streak === 0);
  ok('the best streak is remembered', Save.me().stats.bestStreak === 2);

  /* ---------- shop ---------- */
  fresh();
  ok('a new hero starts with the stick and tunic',
     Save.owns('stick') && Save.owns('tunic'));
  ok('buying with no gold is refused', Save.buy('sword') === 'broke');
  ok('the refused purchase cost nothing', Save.me().gold === 0);

  Save.award(20000, 0);   // enough for several tiers; prices get retuned
  ok('buying with enough gold works', Save.buy('sword') === 'ok');
  ok('the gold was actually spent', Save.me().gold === 20000 - Save.item('sword').cost);
  ok('the item is owned', Save.owns('sword'));
  ok('buying it twice is refused', Save.buy('sword') === 'owned');
  ok('a purchased weapon is equipped', Save.me().inventory.weapon === 'sword');
  ok('buying something that does not exist is refused', Save.buy('unicorn-cannon') === 'nosuch');

  Save.buy('vest');
  ok('armor raises max hearts', Save.loadout().maxHp === 6);
  Save.buy('chick');
  ok('a pet adds thinking time', Save.loadout().bonusTime === 2000);
  ok('a pet shows up in the arena', Save.loadout().pet === '🐣');
  Save.buy('flame');
  ok('the flame blade upgrades double hits', Save.loadout().superDamage === 3);

  Save.equip('sword');
  ok('equipping an owned weapon works', Save.me().inventory.weapon === 'sword');
  ok('equipping an unowned item is refused', Save.equip('axe') === false);

  /* ---------- the v2 economy ---------- */
  fresh();
  ok('a new hero has a trinket slot', Save.me().inventory.trinket === null);

  // every tier of every slot must be reachable, or a price is a typo
  ['weapon', 'armor', 'pet', 'trinket'].forEach(function (kind) {
    var tiers = Save.SHOP.filter(function (i) { return i.kind === kind; });
    ok(kind + ': has at least 5 tiers', tiers.length >= 5, 'got ' + tiers.length);
    var costs = tiers.map(function (i) { return i.cost; });
    var sorted = costs.slice().sort(function (a, b) { return a - b; });
    ok(kind + ': tiers are priced in ascending order',
       JSON.stringify(costs) === JSON.stringify(sorted), costs.join(','));
    ok(kind + ': exactly one tier is gated on a card set',
       tiers.filter(function (i) { return i.set; }).length === 1);
  });

  // the set-gated top tier must refuse gold alone
  fresh();
  Save.award(999999, 0);
  var gated = Save.SHOP.filter(function (i) { return i.set; });
  ok('every set-gated item names a real world',
     gated.every(function (i) { return !!Save.world(i.set); }));
  ok('a set-gated item is refused however rich you are',
     gated.every(function (i) { return Save.buy(i.id) === 'noset'; }));
  ok('the refusal spent nothing', Save.me().gold === 999999);

  // ...and accept once the set is held
  fresh();
  Save.award(999999, 0);
  var reef = Save.world('reef');
  reef.foes.math.concat(reef.foes.language).forEach(function (f) {
    Save.update(function (p) { p.cards[f.id] = 1; });
  });
  ok('holding every card completes the set', Save.hasSet('reef') === true);
  ok('a completed set appears in setsHeld', Save.setsHeld().indexOf('reef') !== -1);
  var reefItem = Save.SHOP.filter(function (i) { return i.set === 'reef'; })[0];
  ok('the set-gated item can now be bought', Save.buy(reefItem.id) === 'ok');
  ok('a finished set grants a permanent heart', Save.loadout().maxHp >= 6);

  // world gold multipliers
  fresh();
  Save.setContext('math');
  ok('the starting world pays the base rate', Math.abs(Save.goldRate() - 1) < 0.001);
  Save.award(1000000, 0);
  Save.buy('world-ember');
  Save.setWorld('ember');
  ok('a harder world pays more',
     Math.abs(Save.goldRate() - Save.world('ember').gold) < 0.001,
     'rate ' + Save.goldRate());
  Save.setContext('story');
  ok("Story Quest doesn't get the world multiplier",
     Math.abs(Save.goldRate() - 1) < 0.001, 'rate ' + Save.goldRate());

  // the award actually pays the multiplied amount
  fresh();
  Save.setContext('math');
  Save.award(1000000, 0);
  Save.buy('world-cave');
  Save.setWorld('cave');
  var before = Save.me().gold;
  var paid = Save.award(100, 0);
  ok('the multiplier is applied when paying out',
     paid.gold === Math.round(100 * Save.world('cave').gold),
     'paid ' + paid.gold);
  ok('the banked gold matches what was reported',
     Save.me().gold === before + paid.gold);

  // a trinket's gold bonus stacks on top
  fresh();
  Save.setContext('math');
  Save.award(1000000, 0);
  Save.buy('coin');
  ok('a lucky coin raises the rate',
     Save.goldRate() > 1, 'rate ' + Save.goldRate());

  /* ---------- migration from v1 ---------- */
  Save.reset();
  var v1 = {
    v: 1, active: 'old',
    profiles: { old: { name: 'Veteran', avatar: '🦊', xp: 400, gold: 500,
      inventory: { owned: ['stick', 'tunic'], weapon: 'stick', armor: 'tunic', pet: null, tokens: 2 },
      cards: { 'm-slime': 3 },
      progress: { world: 'meadow', unlockedWorlds: ['meadow'], runsWon: {}, questsDone: [], seqTier: 2 },
      settings: { modeByGame: {}, lastTrack: {} },
      stats: { correct: 10, wrong: 2, streak: 0, bestStreak: 5 } } }
  };
  localStorage.setItem(Save._key, JSON.stringify(v1));
  Save._reload();
  ok('a v1 save still loads', Save.me() && Save.me().name === 'Veteran');
  ok('gold is scaled by the rebalance factor',
     Save.me().gold === 500 * Save._goldScale, 'got ' + Save.me().gold);
  ok('the migration adds the trinket slot', Save.me().inventory.trinket === null);
  ok('the migration keeps what was already earned',
     Save.me().xp === 400 && Save.me().cards['m-slime'] === 3 &&
     Save.me().inventory.tokens === 2);
  ok('the save is stamped with the new version', Save.load().v === Save._version);
  ok('the new version was written to storage',
     JSON.parse(localStorage.getItem(Save._key)).v === Save._version);

  // running it twice must not pay twice
  var afterFirst = Save.me().gold;
  Save._reload();
  ok('the migration does not run a second time',
     Save.me().gold === afterFirst, 'got ' + Save.me().gold);

  /* ---------- worlds ---------- */
  fresh();
  Save.award(100000, 0);   // enough for any world; prices get retuned
  ok('only the meadow is unlocked at first', Save.me().progress.unlockedWorlds.length === 1);
  ok('a locked world cannot be selected', Save.setWorld('cave') === false);
  Save.buy('world-cave');
  ok('buying a world unlocks it', Save.me().progress.unlockedWorlds.indexOf('cave') !== -1);
  ok('an unlocked world can be selected', Save.setWorld('cave') === true);
  ok('the foe lineup follows the world', Save.foesFor('math')[0].id === 'm-crab');
  ok('math fights four monsters', Save.foesFor('math').length === 4);
  ok('language fights five', Save.foesFor('language').length === 5);

  /* ---------- tokens ---------- */
  fresh();
  ok('no tokens to start', Save.useToken() === false);
  Save.award(100000, 0);
  Save.buy('ipad');
  ok('a token can be bought', Save.me().inventory.tokens === 1);
  ok('tokens can be bought more than once', Save.buy('ipad') === 'ok');
  ok('two tokens are held', Save.me().inventory.tokens === 2);
  ok('spending a token works', Save.useToken() === true);
  ok('the token was consumed', Save.me().inventory.tokens === 1);

  /* ---------- cards: rarity, pity, foils ---------- */
  fresh();
  ok('awarding no card id is a no-op', Save.awardCard(null) === null);
  ok('a forced award always drops', !!Save.awardCard('m-slime', true));
  ok('the card is held once', Save.held('m-slime') === 1);

  /* Drop rate. Every roll here is against the same common monster, and the
     pity counter is reset each time so it can't skew the measurement — this
     is the natural rate on its own. */
  function measureRate(cardId, rolls) {
    var hits = 0;
    for (var i = 0; i < rolls; i++) {
      Save.update(function (p) { p.progress.koSinceCard = 0; });
      if (Save.awardCard(cardId)) hits++;
    }
    return hits / rolls;
  }

  fresh();
  var N = 4000;
  var common = measureRate('m-slime', N);      // rarity 1
  var want = Save.ECONOMY.cardChance;
  ok('a common card drops near its configured rate',
     Math.abs(common - want) < 0.03, 'got ' + common.toFixed(3) + ', want ' + want);

  fresh();
  var legend = measureRate('m-dragon', N);     // rarity 3
  var wantL = Save.ECONOMY.cardChance * Save.ECONOMY.cardRarityOdds[3];
  ok('a legendary drops far less often',
     Math.abs(legend - wantL) < 0.02, 'got ' + legend.toFixed(3) + ', want ' + wantL);
  ok('legendaries are rarer than commons', legend < common / 2);

  /* Cards must be RARE — the whole point of the change. At the configured
     rate a run of four monsters should usually pay nothing. */
  ok('most monsters drop nothing', common < 0.25, 'rate ' + common.toFixed(3));

  /* The pity counter is the floor: go this many monsters with no drop and the
     next one is certain. */
  fresh();
  var pityAt = Save.ECONOMY.cardPity;
  Save.update(function (p) { p.progress.koSinceCard = pityAt - 1; });
  ok('the pity counter forces a drop', !!Save.awardCard('m-dragon'));
  ok('a drop resets the pity counter', Save.me().progress.koSinceCard === 0);

  fresh();
  var longest = 0, since = 0;
  for (var i = 0; i < 2000; i++) {
    if (Save.awardCard('m-dragon')) { since = 0; } else { since++; longest = Math.max(longest, since); }
  }
  ok('no drought ever runs past the pity limit',
     longest < pityAt, 'longest drought ' + longest + ', limit ' + pityAt);

  /* Foils */
  fresh();
  var foils = 0, drops = 0;
  for (var i = 0; i < 3000; i++) {
    var d2 = Save.awardCard('m-slime', true);
    drops++;
    if (d2.foil) foils++;
  }
  var foilRate = foils / drops;
  ok('foils land near their configured rate',
     Math.abs(foilRate - Save.ECONOMY.foilChance) < 0.025,
     'got ' + foilRate.toFixed(3) + ', want ' + Save.ECONOMY.foilChance);
  ok('foils are counted separately from plain copies',
     Save.foilsOf('m-slime') === foils && Save.held('m-slime') === drops);

  ok('a repeat is reported as a duplicate',
     Save.awardCard('m-slime', true).how === 'dupe');
  fresh();
  ok('a first catch is reported as new',
     Save.awardCard('m-bat', true).how === 'new');

  /* ---------- the trader ---------- */
  fresh();
  ok('nothing to sell with a single copy', Save.spares('m-slime') === 0);
  for (var i = 0; i < 4; i++) Save.awardCard('m-slime', true);
  ok('everything past the first copy is spare', Save.spares('m-slime') === 3);

  var goldBefore = Save.me().gold;
  var paid = Save.sellSpares('m-slime');
  ok('selling spares pays gold', paid > 0);
  ok('the gold arrived', Save.me().gold === goldBefore + paid);
  ok('one copy is always kept', Save.held('m-slime') === 1);
  ok('selling again pays nothing', Save.sellSpares('m-slime') === 0);

  // rarity sets the price
  ok('a legendary spare is worth more than a common',
     Save.spareValue('m-dragon') > Save.spareValue('m-slime'));

  // a foil is worth more, and is spent last
  fresh();
  Save.update(function (p) { p.cards['m-slime'] = 3; p.foils['m-slime'] = 1; });
  var withFoil = Save.spareList()[0].gold;
  fresh();
  Save.update(function (p) { p.cards['m-slime'] = 3; });
  var without = Save.spareList()[0].gold;
  ok('a foil spare is worth more than a plain one', withFoil > without,
     withFoil + ' vs ' + without);

  /* Trading a pile of spares for a card you're missing — the guarantee that a
     collection can always be finished by playing, not only by luck. */
  fresh();
  ok('trading with no spares is refused', Save.tradeForCard('m-dragon') === 'short');
  ok('the refusal left the card uncollected', Save.held('m-dragon') === 0);

  var cost = Save.ECONOMY.wildCardCost;
  Save.update(function (p) { p.cards['m-slime'] = cost + 1; });
  ok('enough spares are counted', Save.spareCount() >= cost);
  ok('trading for a missing card works', Save.tradeForCard('m-dragon') === 'ok');
  ok('the traded card is held', Save.held('m-dragon') === 1);
  ok('the spares were spent', Save.spareCount() < cost);
  ok('trading for one you already have is refused',
     Save.tradeForCard('m-dragon') === 'have');
  ok('trading for a card that does not exist is refused',
     Save.tradeForCard('not-a-card') === 'nosuch');

  ok('missing cards are listed', Save.missingCards().length > 0);
  ok('a held card is not listed as missing',
     Save.missingCards().every(function (c) { return c.id !== 'm-dragon'; }));

  /* ---------- set perks ---------- */
  fresh();
  var baseHp = Save.loadout().maxHp;
  var meadow = Save.world('meadow');
  meadow.foes.math.concat(meadow.foes.language).forEach(function (f) {
    Save.update(function (p) { p.cards[f.id] = 1; });
  });
  ok('finishing the meadow set is detected', Save.hasSet('meadow'));
  ok('the meadow perk adds a heart', Save.loadout().maxHp === baseHp + 1);
  ok('every world has a set perk',
     Save.WORLDS.every(function (w) { return !!Save.SET_PERKS[w.id]; }));
  ok('set progress reports the meadow as done',
     Save.setProgress().filter(function (sp) { return sp.id === 'meadow'; })[0].done);
  ok('set progress counts partial worlds',
     Save.setProgress().filter(function (sp) { return sp.id === 'ember'; })[0].got === 0);

  var cards = Save.allCards();
  ok('every world+story card is listed',
     cards.length === Save.WORLDS.length * 9 + Save.STORY_CARDS.length,
     'got ' + cards.length);
  var ids = cards.map(function (c) { return c.id; });
  ok('card ids are unique across the site', new Set(ids).size === ids.length);
  ok('every card carries its rarity',
     cards.every(function (c) { return c.r >= 1 && c.r <= 3; }));

  // this block stands on its own rather than inheriting an earlier test's cards
  fresh();
  Save.awardCard('m-slime', true);
  Save.awardCard('m-slime', true);
  cards = Save.allCards();
  ok('held counts come through',
     cards.filter(function (c) { return c.id === 'm-slime'; })[0].count === 2);
  ok('uncaught monsters read zero',
     cards.filter(function (c) { return c.id === 'l-titan'; })[0].count === 0);

  /* ---------- the map ---------- */
  fresh();
  ok('both trails have stops',
     Save.MAP.little.length > 10 && Save.MAP.big.length > 10);
  ok('a new hero starts at the beginning of both trails',
     Save.mapAt('little') === 0 && Save.mapAt('big') === 0);

  ok('the first stop is playable', Save.nodeState('little', 0) === 'next');
  ok('the second is locked', Save.nodeState('little', 1) === 'locked');
  ok('a far stop is locked', Save.nodeState('little', 5) === 'locked');

  ok('a locked stop cannot be started', Save.startNode('little', 3) === false);
  ok('nothing is armed after a refused start', Save.activeNode() === null);

  ok('the next stop can be started', Save.startNode('little', 0) === true);
  var node = Save.activeNode();
  ok('the armed stop knows its game', !!node && !!node.g);
  ok('the armed stop knows where it is', node.i === 0 && node.trail === 'little');
  ok('the armed stop carries its label', !!node.label);

  var res = Save.completeNode();
  ok('winning a stop advances the trail', res.advanced === true);
  ok('the trail moved on', Save.mapAt('little') === 1);
  ok('nothing stays armed after completing', Save.activeNode() === null);
  ok('the beaten stop reads as done', Save.nodeState('little', 0) === 'done');
  ok('the next one opened up', Save.nodeState('little', 1) === 'next');

  /* Replaying a stop you've already beaten is allowed, but must not walk the
     trail forward twice. */
  ok('a beaten stop can be replayed', Save.startNode('little', 0) === false);
  ok('replaying is refused because it is no longer "next"',
     Save.nodeState('little', 0) === 'done');

  Save.startNode('little', 1);
  Save.completeNode();
  ok('the trail advances again', Save.mapAt('little') === 2);

  /* completing with nothing armed must be a no-op, not a crash */
  ok('completing nothing is harmless', Save.completeNode() === null);
  ok('the trail did not move', Save.mapAt('little') === 2);

  /* the two trails are independent */
  ok('the other trail is untouched', Save.mapAt('big') === 0);
  Save.startNode('big', 0);
  Save.completeNode();
  ok('each trail advances on its own',
     Save.mapAt('big') === 1 && Save.mapAt('little') === 2);

  /* clearing */
  Save.startNode('little', 2);
  ok('a stop is armed', Save.activeNode() !== null);
  Save.clearNode();
  ok('clearing disarms it', Save.activeNode() === null);
  ok('clearing did not advance the trail', Save.mapAt('little') === 2);

  /* a stop that needs a world stays shut until it is bought */
  fresh();
  var gate = null, gateTrail = null;
  ['little', 'big'].forEach(function (tr) {
    Save.MAP[tr].forEach(function (n, i) {
      if (!gate && n.needs) { gate = i; gateTrail = tr; }
    });
  });
  ok('some stop needs a world', gate !== null);
  Save.update(function (p) { p.progress.map[gateTrail] = gate; });
  ok('a stop needing an unbought world reads as needing it',
     Save.nodeState(gateTrail, gate) === 'needs');
  ok('it cannot be started', Save.startNode(gateTrail, gate) === false);
  Save.award(100000, 0);
  Save.buy('world-' + Save.MAP[gateTrail][gate].needs);
  ok('buying the world opens it', Save.nodeState(gateTrail, gate) === 'next');
  ok('now it can be started', Save.startNode(gateTrail, gate) === true);

  /* every stop must point at a real game, track and mode */
  ['little', 'big'].forEach(function (tr) {
    var bad = Save.MAP[tr].filter(function (n) {
      if (['math', 'language', 'story'].indexOf(n.g) === -1) return true;
      if (n.g === 'story') return n.quest === undefined && !n.mini;
      return !n.t || !n.m;
    });
    ok(tr + ' trail: every stop names a real game and track', bad.length === 0,
       JSON.stringify(bad.slice(0, 2)));
    var noLabel = Save.MAP[tr].filter(function (n) { return !n.label; });
    ok(tr + ' trail: every stop has a label', noLabel.length === 0);
  });

  /* ---------- progress bookkeeping ---------- */
  fresh();
  Save.recordRunWon('math');
  Save.recordRunWon('math');
  ok('run wins accumulate', Save.me().progress.runsWon.math === 2);
  Save.recordQuestDone(3);
  Save.recordQuestDone(3);
  ok('a finished quest is only recorded once', Save.me().progress.questsDone.length === 1);
  Save.remember('math', 'mul', 'expert');
  ok('the last track is remembered', Save.me().settings.lastTrack.math === 'mul');
  ok('the mode is remembered per game', Save.me().settings.modeByGame.math === 'expert');

  /* ---------- persistence across a reload ---------- */
  fresh();
  Save.award(77, 33);
  var raw = localStorage.getItem(Save._key);
  ok('the save is actually written to localStorage', !!raw && raw.indexOf('77') !== -1);
  var reparsed = JSON.parse(raw);
  ok('the written blob holds the gold',
     reparsed.profiles[reparsed.active].gold === 77);

  /* ---------- corrupt storage ---------- */
  localStorage.setItem(Save._key, 'this is not json{{{');
  var recovered = JSON.parse(JSON.stringify(
    (function () { Save.reset(); return { p: Save.profiles().length }; })()));
  ok('a corrupt save recovers instead of throwing', recovered.p === 0);

  /* ---------- storage disabled ---------- */
  var realSet = localStorage.setItem;
  localStorage.setItem = function () { throw new Error('QuotaExceededError'); };
  var threw = false;
  try {
    Save.reset();
    Save.createProfile('NoStorage', '🤖');
    Save.award(5, 5);
    Save.buy('sword');
  } catch (e) {
    threw = true;
  }
  localStorage.setItem = realSet;
  ok('a full or disabled localStorage never throws', !threw);

  /* ---------- import ---------- */
  Save.reset();
  var payload = JSON.stringify({
    v: 1, active: 'x',
    profiles: { x: { name: 'Restored', avatar: '🐙', xp: 300, gold: 42,
      inventory: { owned: ['stick'], weapon: 'stick', armor: 'tunic', pet: null, tokens: 0 },
      cards: {}, progress: { world: 'meadow', unlockedWorlds: ['meadow'], runsWon: {}, questsDone: [], seqTier: 1 },
      settings: { modeByGame: {}, lastTrack: {} },
      stats: { correct: 0, wrong: 0, streak: 0, bestStreak: 0 } } }
  });
  Save.importFile(new File([payload], 'p.json', { type: 'application/json' }), function (good, msg) {
    ok('importing a good file succeeds', good === true, msg);
    ok('the imported hero is active', Save.me() && Save.me().name === 'Restored');
    ok('the imported gold came through', Save.me().gold === 42);

    Save.importFile(new File(['not json at all'], 'bad.json'), function (good2, msg2) {
      ok('importing junk is rejected', good2 === false);
      ok('the rejection explains itself', /progress file/.test(msg2), msg2);

      Save.importFile(new File(['{"hello":"world"}'], 'wrong.json'), function (good3, msg3) {
        ok('importing valid JSON with no profiles is rejected', good3 === false);
        ok('that rejection explains itself too', /hero/.test(msg3), msg3);
        finish();
      });
    });
  });
} catch (e) {
  ok('tests ran without throwing', false, e && e.message);
  finish();
}

function finish() {
  try {
    if (stash === null) localStorage.removeItem(Save._key);
    else localStorage.setItem(Save._key, stash);
  } catch (e) { /* nothing to restore into */ }
  var s = document.getElementById('summary');
  s.className = fail ? 'fail' : 'pass';
  s.textContent = fail ? (fail + ' FAILED, ' + pass + ' passed')
                       : ('All ' + pass + ' checks passed.');
  window.RESULT = { pass: pass, fail: fail };
}
</script>
